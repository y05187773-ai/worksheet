<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教材設計エンジニア V9.3 - Prompt Enhancements</title>
    <!-- React & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- KaTeX for Math rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDKyokasho:wght@400;700&family=Klee+One:wght@400;600&family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@400;700&family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        @media print {
            .no-print { display: none !important; }
            .no-print-bg { background: white !important; }
            body { background: white; margin: 0; padding: 0; }
            .worksheet-page {
                box-shadow: none !important;
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
                height: 100vh !important;
                break-after: page !important;
            }
        }
        @page { margin: 0; }
        .write-box {
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            width: 100%;
            background-color: #ffffff;
            position: relative;
            transition: height 0.2s ease-in-out;
        }
        .column-divider {
            border-left: 1px dashed #cbd5e1;
            margin-left: 1rem;
            padding-left: 1rem;
        }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* 発達段階に応じたマス目・罫線（UD配慮の淡いグレー） */
        .bg-lines { background-image: linear-gradient(to bottom, transparent 95%, #e2e8f0 95%); background-size: 100% 1.8em; }
        .bg-grid-large { background-image: linear-gradient(#e2e8f0 1px, transparent 1px), linear-gradient(90deg, #e2e8f0 1px, transparent 1px); background-size: 20mm 20mm; }
        .bg-grid-medium { background-image: linear-gradient(#e2e8f0 1px, transparent 1px), linear-gradient(90deg, #e2e8f0 1px, transparent 1px); background-size: 15mm 15mm; }
        .bg-grid-small { background-image: linear-gradient(#e2e8f0 1px, transparent 1px), linear-gradient(90deg, #e2e8f0 1px, transparent 1px); background-size: 10mm 10mm; }
        .bg-blank { background-image: none; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icon = ({ name, size = 18, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current && window.lucide) {
                    iconRef.current.innerHTML = `<i data-lucide="${name}"></i>`;
                    window.lucide.createIcons({
                        root: iconRef.current,
                        attrs: { 'stroke-width': 2.5, width: size, height: size }
                    });
                }
            }, [name, size]);
            return <span ref={iconRef} className={`inline-flex items-center justify-center align-middle ${className}`}></span>;
        };

        const blockInfo = {
            aim_box: { label: 'めあて・課題', icon: 'target' },
            text: { label: 'テキスト・本文', icon: 'type' },
            bullets: { label: '箇条書きリスト', icon: 'list' },
            checkbox_group: { label: 'チェックリスト', icon: 'check-square' },
            fill_in_box: { label: '強調穴埋め', icon: 'box-select' },
            keywords: { label: 'ヒント語群', icon: 'tags' },
            quote: { label: '引用文・感想', icon: 'quote' },
            write_box: { label: '記述・スケッチ枠', icon: 'pen-tool' },
            self_eval: { label: 'ふりかえり・自己評価', icon: 'smile' }
        };

        const defaultData = {
            title: "算数科：問題解決過程「面積の求め方を考えよう」",
            defaultPageBreaks: ["s3"],
            answers: {
                ans_formula: "たて×横",
                box_idea: "（例）対角線で２つの三角形に分けて、それぞれの面積を計算してから足し合わせる方法があると考えました。",
                box_summary: "平行四辺形の面積は、形を変形して長方形にすることで、「底辺×高さ」で求められることがわかりました。"
            },
            sections: [
                {
                    id: "s1", title: "1. 本時の学習課題", criteria: "【知技】めあてを把握し、既習事項を想起できる。", layout: "1-col",
                    blocks: [
                        { type: "aim_box", content: "平行四辺形の面積の求め方を、今まで習った形に変形して考えよう。" },
                        { type: "text", content: "長方形の面積を求める公式は、（{{ans_formula}}）でしたね。これを活用できないか予想してみましょう。", bold: false, fontSize: "text-lg" },
                        { type: "keywords", words: ["長方形", "三角形", "切って動かす", "公式"] }
                    ]
                },
                {
                    id: "s2", title: "2. 自力解決：自分の考えを書こう", criteria: "【思判表】図や式を用いて論理的に思考し、表現している。", layout: "1-col",
                    blocks: [
                        { type: "write_box", label: "どのように変形すれば面積が求められるか、図や式を使ってかきましょう。", boxId: "box_idea", defaultHeight: 200, bgType: "grid_medium" },
                        { type: "checkbox_group", label: "思考のチェックポイント", items: ["補助線を引いて考えた", "図形を切って動かした", "式と答えを書いた"] }
                    ]
                },
                {
                    id: "s3", title: "3. 比較検討・練り上げ", criteria: "【思判表】他者の考えと比較し、共通点や違いを見出している。", layout: "2-col",
                    leftBlocks: [
                        { type: "quote", content: "Ａさんの考え：\n「はしっ globalこの三角形を切り取って、反対側にくっつけると長方形になります。」" }
                    ],
                    rightBlocks: [
                        { type: "quote", content: "Ｂさんの考え：\n「真ん中で半分に切って、２つの形を組み合わせると長方形になります。」" }
                    ]
                },
                {
                    id: "s4", title: "4. 本時のまとめと振り返り", criteria: "【学向人】学習を省察し、次の学びへの意欲を持っている。", layout: "1-col",
                    blocks: [
                        { type: "write_box", label: "今日の授業でわかった「平行四辺形の面積の公式」をまとめましょう。", boxId: "box_summary", defaultHeight: 120, bgType: "lines" },
                        { type: "self_eval" }
                    ]
                }
            ]
        };

        const App = () => {
            const [worksheetData, setWorksheetData] = useState(defaultData);
            const [history, setHistory] = useState([JSON.parse(JSON.stringify(defaultData))]);
            const [historyIndex, setHistoryIndex] = useState(0);
            const [paperSize, setPaperSize] = useState('A4');
            const [mode, setMode] = useState('student');
            const [pageBreaks, setPageBreaks] = useState(defaultData.defaultPageBreaks || []);
            const [boxHeights, setBoxHeights] = useState({});
            const [overflows, setOverflows] = useState({});
            const [selectedFont, setSelectedFont] = useState('kyokasho');
            const [showHelp, setShowHelp] = useState(false);
            const [isPanelOpen, setIsPanelOpen] = useState(true);
            
            // プロンプト生成関連ステート
            const [showPromptModal, setShowPromptModal] = useState(false);
            const [promptText, setPromptText] = useState("");
            const [copyMessage, setCopyMessage] = useState("");
            const [useImageOption, setUseImageOption] = useState(false);
            
            // 追加: プロンプト用のユーザー入力ステート
            const [promptInputs, setPromptInputs] = useState({
                gradeSubject: "小学校5年生 算数科",
                theme: "「面積の求め方を考えよう」",
                aim: "平行四辺形の面積の求め方を、今まで習った形に変形して考えることができる。",
                criteria: "【思判表】図や式を用いて論理的に思考し、表現している。"
            });

            const [showImportModal, setShowImportModal] = useState(false);
            const [importText, setImportText] = useState("");
            const [importError, setImportError] = useState("");

            const fontOptions = [
                { value: 'kyokasho', label: '教科書体 (推奨)', family: "'BIZ UDKyokasho', 'BIZ UD教科書体', 'UD Digital Kyokasho NP-R', 'Meiryo', sans-serif" },
                { value: 'klee', label: 'Klee One (手書き風)', family: "'Klee One', 'BIZ UDKyokasho', 'Meiryo', sans-serif" },
                { value: 'gothic', label: 'UD ゴシック体', family: "'Noto Sans JP', 'Meiryo', sans-serif" },
                { value: 'mincho', label: 'UD 明朝体', family: "'Noto Serif JP', 'MS PMincho', serif" }
            ];

            useEffect(() => {
                const newHeights = {};
                const processBlocks = (blocks) => {
                    if(!blocks) return;
                    blocks.forEach(block => {
                        if (block.type === 'write_box') {
                            newHeights[block.boxId] = block.defaultHeight || 120;
                        }
                    });
                };
                worksheetData.sections.forEach(section => {
                    processBlocks(section.blocks);
                    processBlocks(section.leftBlocks);
                    processBlocks(section.rightBlocks);
                });
                setBoxHeights(prev => ({...newHeights, ...prev}));
            }, [worksheetData]);

            useEffect(() => {
                const timer = setTimeout(() => {
                    const pageElements = document.querySelectorAll('.worksheet-page');
                    const newOverflows = {};
                    pageElements.forEach((el, idx) => {
                        const content = el.querySelector('.page-content');
                        if (content && content.scrollHeight > el.clientHeight - 20) {
                            newOverflows[idx] = true;
                        }
                    });
                    setOverflows(newOverflows);
                }, 600);
                return () => clearTimeout(timer);
            }, [pageBreaks, paperSize, mode, boxHeights, worksheetData]);

            const updateData = (updater) => {
                const next = JSON.parse(JSON.stringify(worksheetData));
                updater(next);
                setWorksheetData(next);
                const newHistory = history.slice(0, historyIndex + 1);
                newHistory.push(JSON.parse(JSON.stringify(next)));
                if (newHistory.length > 50) newHistory.shift();
                setHistory(newHistory);
                setHistoryIndex(newHistory.length - 1);
            };

            const handleUndo = () => { if (historyIndex > 0) { const idx = historyIndex - 1; setHistoryIndex(idx); setWorksheetData(history[idx]); } };
            const handleRedo = () => { if (historyIndex < history.length - 1) { const idx = historyIndex + 1; setHistoryIndex(idx); setWorksheetData(history[idx]); } };
            const updateAnswer = (key, val) => updateData(d => { d.answers[key] = val; });

            const addBlock = (sIdx, type, col = 'blocks') => {
                updateData(d => {
                    const newId = `key_${Date.now()}`;
                    let newBlock = { type };
                    if (type === 'aim_box') newBlock = { type, content: "本時のめあてを入力" };
                    if (type === 'text') newBlock = { type, content: "新しいテキスト", bold: false, fontSize: "text-base", textAlign: "text-left" };
                    if (type === 'bullets') newBlock = { type, items: ["項目1"] };
                    if (type === 'checkbox_group') newBlock = { type, label: "確認項目", items: ["チェック1"] };
                    if (type === 'fill_in_box') newBlock = { type, label: "問い", answerKey: newId };
                    if (type === 'keywords') newBlock = { type, words: ["キーワード"] };
                    if (type === 'quote') newBlock = { type, content: "引用文" };
                    if (type === 'write_box') newBlock = { type, label: "問い", boxId: newId, defaultHeight: 120, bgType: "lines" };
                    
                    if (!d.sections[sIdx][col]) d.sections[sIdx][col] = [];
                    d.sections[sIdx][col].push(newBlock);
                    if (type === 'fill_in_box' || type === 'write_box') d.answers[newId] = "解答例";
                });
            };

            const cloneBlock = (sIdx, bIdx, col = 'blocks') => {
                updateData(d => {
                    const original = d.sections[sIdx][col][bIdx];
                    const clone = JSON.parse(JSON.stringify(original));
                    if (clone.boxId || clone.answerKey) {
                        const newId = `key_${Date.now()}`;
                        const oldId = clone.boxId || clone.answerKey;
                        if (clone.boxId) clone.boxId = newId;
                        if (clone.answerKey) clone.answerKey = newId;
                        d.answers[newId] = d.answers[oldId] || "";
                    }
                    d.sections[sIdx][col].splice(bIdx + 1, 0, clone);
                });
            };

            const removeBlock = (sIdx, bIdx, col = 'blocks') => updateData(d => { d.sections[sIdx][col].splice(bIdx, 1); });
            const moveBlock = (sIdx, bIdx, dir, col = 'blocks') => {
                updateData(d => {
                    const blocks = d.sections[sIdx][col];
                    if (dir === -1 && bIdx > 0) [blocks[bIdx-1], blocks[bIdx]] = [blocks[bIdx], blocks[bIdx-1]];
                    else if (dir === 1 && bIdx < blocks.length - 1) [blocks[bIdx], blocks[bIdx+1]] = [blocks[bIdx+1], blocks[bIdx]];
                });
            };

            const addSection = () => updateData(d => { d.sections.push({ id: `s_${Date.now()}`, title: "新しい大問", criteria: "評価規準", layout: "1-col", blocks: [] }); });
            const cloneSection = (sIdx) => updateData(d => {
                const clone = JSON.parse(JSON.stringify(d.sections[sIdx]));
                clone.id = `s_${Date.now()}`;
                const reMapIds = (blocks) => {
                    if(!blocks) return;
                    blocks.forEach(b => {
                        if (b.boxId || b.answerKey) {
                            const oldId = b.boxId || b.answerKey;
                            const newId = `key_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`;
                            if (b.boxId) b.boxId = newId;
                            if (b.answerKey) b.answerKey = newId;
                            d.answers[newId] = d.answers[oldId] || "";
                        }
                    });
                };
                reMapIds(clone.blocks);
                reMapIds(clone.leftBlocks);
                reMapIds(clone.rightBlocks);
                d.sections.splice(sIdx + 1, 0, clone);
            });

            const removeSection = (sIdx) => updateData(d => { d.sections.splice(sIdx, 1); });
            const moveSection = (sIdx, dir) => updateData(d => {
                if (dir === -1 && sIdx > 0) [d.sections[sIdx-1], d.sections[sIdx]] = [d.sections[sIdx], d.sections[sIdx-1]];
                else if (dir === 1 && sIdx < d.sections.length - 1) [d.sections[sIdx], d.sections[sIdx+1]] = [d.sections[sIdx+1], d.sections[sIdx]];
            });

            const toggleLayout = (sIdx) => updateData(d => {
                const s = d.sections[sIdx];
                if (s.layout === '2-col') {
                    s.blocks = [...(s.leftBlocks || []), ...(s.rightBlocks || [])];
                    s.leftBlocks = []; s.rightBlocks = []; s.layout = '1-col';
                } else {
                    s.leftBlocks = s.blocks || []; s.rightBlocks = []; s.blocks = []; s.layout = '2-col';
                }
            });

            const handleImportJson = () => {
                if (!importText.trim()) {
                    setImportError("JSONテキストを入力してください。");
                    return;
                }
                try {
                    const data = JSON.parse(importText);
                    if (data.sections && data.answers) { 
                        setWorksheetData(data); 
                        setHistory([JSON.parse(JSON.stringify(data))]); 
                        setHistoryIndex(0);
                        setPageBreaks(data.defaultPageBreaks || []);
                        setShowImportModal(false);
                        setImportText("");
                        setImportError("");
                    } else {
                        setImportError("無効なデータ形式です。sectionsとanswersが必要です。");
                    }
                } catch (err) { 
                    setImportError("JSONの読み込みに失敗しました。形式が正しいか確認してください。"); 
                }
            };

            const handleDownloadJson = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ ...worksheetData, defaultPageBreaks: pageBreaks }, null, 2));
                const a = document.createElement('a'); a.href = dataStr; a.download = `worksheet_${Date.now()}.json`; a.click();
            };

            const resetBoxHeights = () => {
                const newHeights = {};
                const process = (blocks) => {
                    if(!blocks) return;
                    blocks.forEach(b => { if(b.type === 'write_box') newHeights[b.boxId] = b.defaultHeight || 120; });
                };
                worksheetData.sections.forEach(s => {
                    process(s.blocks); process(s.leftBlocks); process(s.rightBlocks);
                });
                setBoxHeights(newHeights);
            };

            // AIプロンプト生成ロジック（入力フォーム対応版）
            const generatePrompt = (useImg, data, inputs) => {
                return `あなたはプロの教員であり、優秀な教材設計エンジニアです。
教育学的知見（学力の三要素、評価の三観点、個別最適な学びと協同的な学び）に基づき、児童の思考プロセスを構造化するワークシートを作成してください。

【テーマ・対象】
学年・教科：${inputs.gradeSubject}
単元名・テーマ：${inputs.theme}

【学習のねらい・評価規準】
ねらい：${inputs.aim}
評価規準：${inputs.criteria}
${useImg ? '\n※添付された教科書や資料の画像がある場合は、OCRで内容（テキストや重要な発問、図解の意図など）を読み取り、学習内容に沿ってワークシートを構成してください。\n' : ''}
【設計の要件・制約】
1. 指定されたJSONのデータ構造（sections, answers）を厳密に維持してください。
2. 以下のブロック（type）を駆使して学習活動を構成してください：
   - "aim_box": 授業の導入で示される問い（めあて）。
   - "text": 資料の提示や説明（穴埋めは {{キー名}} を使用）。
   - "keywords": 児童の認知を助けるヒント語彙バンク。
   - "checkbox_group": 気付きや観察、思考のチェックポイント。
   - "write_box": 記述やスケッチを行う自力解決エリア。必ず "bgType" を指定すること（"lines": 罫線, "grid_large": 低学年用20mmマス, "grid_medium": 中学年用15mmマス, "grid_small": 高学年用10mmマス, "blank": 無地）。
   - "self_eval": 学習の省察と次への意欲を形成する振り返り欄（末尾に配置）。
3. 穴埋め（text内）や write_box の模範解答は、必ず answers オブジェクトに含めてください。
4. 出力は純粋なJSONテキストのみとし、Markdown記法（\`\`\`json など）は絶対に除外してください。

【参考にするフォーマット（現在のデータ）】
${JSON.stringify(data, null, 2)}`;
            };

            const openPromptModal = () => {
                setUseImageOption(false);
                setPromptText(generatePrompt(false, worksheetData, promptInputs));
                setShowPromptModal(true);
                setCopyMessage("");
            };

            // 追加: フォームの入力ハンドラ
            const handlePromptInputChange = (field, value) => {
                const newInputs = { ...promptInputs, [field]: value };
                setPromptInputs(newInputs);
                setPromptText(generatePrompt(useImageOption, worksheetData, newInputs));
            };

            const handleCopyPrompt = () => {
                const textarea = document.createElement('textarea');
                textarea.value = promptText;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    setCopyMessage("クリップボードにコピーしました！ChatGPTやClaudeなどに貼り付けてご活用ください。");
                } catch (err) {
                    setCopyMessage("コピーに失敗しました。手動でテキストを選択してコピーしてください。");
                }
                document.body.removeChild(textarea);
                setTimeout(() => setCopyMessage(""), 3000);
            };

            const renderTextWithBlanks = (text) => {
                if (!text) return "";
                const parts = text.split(/(\{\{[^}]+\}\})/g);
                return parts.map((part, i) => {
                    const match = part.match(/\{\{([^}]+)\}\}/);
                    if (match) {
                        const key = match[1];
                        return <span key={i} className={mode === 'teacher' ? 'text-red-600 font-bold px-2 underline decoration-red-300' : 'border-b border-gray-400 px-10'}>{mode === 'teacher' ? ((worksheetData.answers && worksheetData.answers[key]) || '') : ''}</span>;
                    }
                    
                    const mathParts = part.split(/(\$\$[\s\S]+?\$\$|\$[\s\S]+?\$)/g);
                    return (
                        <span key={i}>
                            {mathParts.map((mathPart, j) => {
                                if (mathPart.startsWith('$$') && mathPart.endsWith('$$')) {
                                    const math = mathPart.slice(2, -2);
                                    if (window.katex) {
                                        try {
                                            const html = window.katex.renderToString(math, { displayMode: true, throwOnError: false });
                                            return <span key={j} dangerouslySetInnerHTML={{ __html: html }} />;
                                        } catch (e) { return <span key={j}>{mathPart}</span>; }
                                    }
                                } else if (mathPart.startsWith('$') && mathPart.endsWith('$')) {
                                    const math = mathPart.slice(1, -1);
                                    if (window.katex) {
                                        try {
                                            const html = window.katex.renderToString(math, { displayMode: false, throwOnError: false });
                                            return <span key={j} dangerouslySetInnerHTML={{ __html: html }} />;
                                        } catch (e) { return <span key={j}>{mathPart}</span>; }
                                    }
                                }
                                return <span key={j}>{mathPart}</span>;
                            })}
                        </span>
                    );
                });
            };

            const renderBlock = (sIdx, bIdx, block, col = 'blocks') => {
                if (mode === 'edit') {
                    const info = blockInfo[block.type] || { label: block.type, icon: 'box' };
                    return (
                        <div key={bIdx} className="mb-4 relative font-sans bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm hover:shadow-md transition-shadow">
                            
                            <div className="flex items-center justify-between px-3 py-2 bg-slate-50 border-b border-slate-200">
                                <div className="flex items-center gap-1.5 text-blue-600">
                                    <Icon name={info.icon} size={16} />
                                    <span className="text-xs font-bold">{info.label}</span>
                                </div>
                                <div className="flex gap-1">
                                    <button onClick={() => moveBlock(sIdx, bIdx, -1, col)} className="p-1.5 bg-white border border-slate-300 rounded hover:bg-slate-100 text-slate-600 shadow-sm active:scale-95" title="上へ移動"><Icon name="chevron-up" size={14}/></button>

                                </div>
                                <div className="p-4 bg-slate-50 border-t border-slate-100 flex justify-end gap-3">
                                    <button onClick={() => setShowImportModal(false)} className="bg-white text-slate-600 border border-slate-300 font-bold px-6 py-2.5 rounded-xl hover:bg-slate-50 transition-colors active:scale-95">キャンセル</button>
                                    <button onClick={handleImportJson} className="bg-blue-600 text-white font-bold px-8 py-2.5 rounded-xl hover:bg-blue-700 transition-colors shadow-lg active:scale-95 flex items-center gap-2">
                                        <Icon name="upload" size={18}/> 読み込む
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* AIプロンプトモーダル */}
                    {showPromptModal && (
                        <div className="fixed inset-0 bg-slate-900/40 flex items-center justify-center z-[100] p-4 font-sans backdrop-blur-sm transition-opacity">
                            <div className="bg-white rounded-3xl shadow-2xl max-w-4xl w-full max-h-[90vh] flex flex-col overflow-hidden animate-[fadeIn_0.2s_ease-out]">
                                <div className="flex items-center justify-between p-6 border-b border-slate-100 bg-slate-50 shrink-0">
                                    <h2 className="text-xl font-black text-slate-800 flex items-center gap-2">
                                        <Icon name="sparkles" className="text-amber-500"/> AI生成用プロンプト出力
                                    </h2>
                                    <button onClick={() => setShowPromptModal(false)} className="p-2 bg-white border border-slate-200 text-slate-500 hover:bg-slate-100 hover:text-slate-800 rounded-full transition-colors"><Icon name="x"/></button>
                                </div>
                                <div className="p-6 flex-1 overflow-y-auto flex flex-col gap-4">
                                    <p className="text-sm text-slate-600 font-bold">
                                        以下のフォームに入力すると、AIに渡すプロンプトが自動生成されます。完成したテキストをコピーしてAIに送信してください。
                                    </p>
                                    
                                    {/* プロンプト入力フォーム */}
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 p-5 bg-slate-50 border border-slate-200 rounded-xl">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">学年・教科</label>
                                            <input 
                                                value={promptInputs.gradeSubject} 
                                                onChange={e => handlePromptInputChange('gradeSubject', e.target.value)} 
                                                className="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-200 outline-none" 
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">単元名・テーマ</label>
                                            <input 
                                                value={promptInputs.theme} 
                                                onChange={e => handlePromptInputChange('theme', e.target.value)} 
                                                className="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-200 outline-none" 
                                            />
                                        </div>
                                        <div className="md:col-span-2">
                                            <label className="block text-xs font-bold text-slate-500 mb-1">学習のねらい</label>
                                            <input 
                                                value={promptInputs.aim} 
                                                onChange={e => handlePromptInputChange('aim', e.target.value)} 
                                                className="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-200 outline-none font-bold text-blue-700 bg-blue-50/30" 
                                            />
                                        </div>
                                        <div className="md:col-span-2">
                                            <label className="block text-xs font-bold text-slate-500 mb-1">評価規準</label>
                                            <input 
                                                value={promptInputs.criteria} 
                                                onChange={e => handlePromptInputChange('criteria', e.target.value)} 
                                                className="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-200 outline-none text-slate-600" 
                                                placeholder="例：【知技】〜について理解している"
                                            />
                                        </div>
                                    </div>

                                    {/* OCR連携オプション */}
                                    <div className="flex flex-col gap-2 p-4 bg-blue-50/80 rounded-xl border border-blue-100">
                                        <label className="flex items-center gap-3 cursor-pointer group w-max">
                                            <input 
                                                type="checkbox" 
                                                checked={useImageOption}
                                                onChange={(e) => {
                                                    setUseImageOption(e.target.checked);
                                                    setPromptText(generatePrompt(e.target.checked, worksheetData, promptInputs));
                                                }}
                                                className="w-5 h-5 text-blue-600 rounded border-slate-300 focus:ring-blue-500 cursor-pointer"
                                            />
                                            <span className="text-sm font-black text-blue-800 flex items-center gap-1.5 group-hover:text-blue-600 transition-colors">
                                                <Icon name="image" size={18}/> 教科書や資料の画像からワークシートを生成する（OCR連携）
                                            </span>
                                        </label>
                                        {useImageOption && (
                                            <p className="text-xs text-blue-600 font-bold ml-8">
                                                ✓ プロンプトに画像の読み取り指示が追加されました。AIにこのプロンプトを貼り付ける際、一緒に教科書の画像を添付して送信してください。
                                            </p>
                                        )}
                                    </div>

                                    <textarea 
                                        value={promptText} 
                                        onChange={e => setPromptText(e.target.value)} 
                                        className="w-full shrink-0 border border-slate-300 rounded-xl p-4 text-sm font-mono focus:ring-2 focus:ring-amber-200 outline-none resize-none bg-slate-50 min-h-[150px]"
                                    ></textarea>
                                    
                                    {copyMessage && (
                                        <div className="bg-emerald-50 text-emerald-600 px-4 py-3 rounded-lg text-sm font-bold border border-emerald-200 text-center animate-pulse flex items-center justify-center gap-2">
                                            <Icon name="check-circle" size={18}/> {copyMessage}
                                        </div>
                                    )}
                                </div>
                                <div className="p-4 bg-slate-50 border-t border-slate-100 flex justify-end gap-3 shrink-0">
                                    <button onClick={() => setShowPromptModal(false)} className="bg-white text-slate-600 border border-slate-300 font-bold px-6 py-2.5 rounded-xl hover:bg-slate-50 transition-colors active:scale-95">閉じる</button>
                                    <button onClick={handleCopyPrompt} className="bg-amber-500 text-white font-bold px-8 py-2.5 rounded-xl hover:bg-amber-600 transition-colors shadow-lg active:scale-95 flex items-center gap-2">
                                        <Icon name="copy" size={18}/> プロンプトをコピー
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 操作パネル */}
                    {isPanelOpen ? (
                        <div className="max-w-6xl mx-auto mb-8 bg-white p-4 sm:p-5 rounded-3xl shadow-2xl no-print border border-slate-200 sticky top-4 z-50 font-sans flex flex-wrap items-center justify-between gap-5 relative transition-all duration-300">
                            
                            <button 
                                onClick={() => setIsPanelOpen(false)} 
                                className="absolute -top-3 -right-3 bg-slate-800 text-white rounded-full p-2 shadow-lg hover:bg-slate-700 transition-colors z-50"
                                title="パネルを隠す"
                            >
                                <Icon name="chevron-up" size={18} />
                            </button>

                            <div className="flex flex-col">
                                <h1 className="text-xl sm:text-2xl font-black text-slate-800 tracking-tight flex items-center gap-2"><Icon name="layout-template" className="text-blue-500" /> 教材設計エンジニア V9.3</h1>
                                <span className="text-[10px] sm:text-xs font-bold text-slate-400 uppercase tracking-widest italic mt-0.5">Educational Format Spec</span>
                            </div>
                            
                            <div className="flex flex-wrap items-center gap-3">
                                <div className="flex bg-slate-100 p-1.5 rounded-2xl shadow-inner">
                                    {['student', 'teacher', 'edit'].map(m => (
                                        <button key={m} onClick={() => setMode(m)} className={`px-4 sm:px-6 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition-all duration-200 ${mode === m ? 'bg-white shadow-md text-blue-600 scale-[1.02]' : 'text-slate-500 hover:text-slate-700'}`}>
                                            {m === 'student' ? '生徒用' : m === 'teacher' ? '解答付' : '編集モード'}
                                        </button>
                                    ))}
                                </div>
                                
                                <div className="hidden sm:block w-px h-10 bg-slate-200 mx-2"></div>

                                <div className="flex gap-2 w-full sm:w-auto mt-2 sm:mt-0">
                                    <button onClick={() => {setShowImportModal(true); setImportText(""); setImportError("");}} className="flex-1 sm:flex-none px-4 py-2.5 bg-slate-50 text-slate-600 rounded-xl border border-slate-200 text-xs sm:text-sm font-bold flex items-center justify-center gap-2 hover:bg-slate-100 active:scale-95 transition-transform"><Icon name="file-json" size={16}/>JSON読込</button>
                                    <button onClick={handleDownloadJson} className="flex-1 sm:flex-none px-4 py-2.5 bg-blue-50 text-blue-600 rounded-xl border border-blue-200 text-xs sm:text-sm font-bold flex items-center justify-center gap-2 hover:bg-blue-100 active:scale-95 transition-transform"><Icon name="save" size={16}/>保存</button>
                                </div>
                            </div>

                            <div className="flex flex-wrap items-center gap-3 w-full lg:w-auto justify-end">
                                <button onClick={openPromptModal} className="px-4 py-2.5 bg-amber-50 text-amber-600 border border-amber-200 rounded-xl hover:bg-amber-100 flex items-center justify-center transition-colors shadow-sm text-xs sm:text-sm font-bold gap-2 active:scale-95" title="AI用プロンプトを生成">
                                    <Icon name="sparkles" size={16}/> AIプロンプト
                                </button>
                                
                                <button onClick={() => setShowHelp(true)} className="p-2.5 bg-indigo-50 text-indigo-600 border border-indigo-200 rounded-xl hover:bg-indigo-100 flex items-center justify-center transition-colors shadow-sm" title="使い方ガイド"><Icon name="help-circle" size={18}/></button>
                                
                                {mode === 'edit' && (
                                    <div className="flex gap-2 mr-2">
                                        <button onClick={handleUndo} disabled={historyIndex === 0} className={`p-2.5 rounded-xl border transition flex items-center justify-center ${historyIndex === 0 ? 'bg-slate-50 text-slate-300 border-slate-100' : 'bg-emerald-50 text-emerald-600 border-emerald-200 hover:bg-emerald-100 shadow-sm active:scale-95'}`} title="元に戻す"><Icon name="undo-2" size={18}/></button>
                                        <button onClick={handleRedo} disabled={historyIndex === history.length - 1} className={`p-2.5 rounded-xl border transition flex items-center justify-center ${historyIndex === history.length - 1 ? 'bg-slate-50 text-slate-300 border-slate-100' : 'bg-emerald-50 text-emerald-600 border-emerald-200 hover:bg-emerald-100 shadow-sm active:scale-95'}`} title="やり直す"><Icon name="redo-2" size={18}/></button>
                                        <button onClick={resetBoxHeights} className="p-2.5 bg-amber-50 text-amber-600 border border-amber-200 rounded-xl hover:bg-amber-100 flex items-center justify-center shadow-sm active:scale-95" title="枠のサイズを初期化"><Icon name="maximize" size={18}/></button>
                                    </div>
                                )}
                                <div className="flex gap-2">
                                    <select value={selectedFont} onChange={(e) => setSelectedFont(e.target.value)} className="border border-slate-300 rounded-xl px-3 py-2.5 text-xs sm:text-sm font-bold bg-white outline-none focus:ring-2 focus:ring-blue-100 shadow-sm cursor-pointer">
                                        {fontOptions.map(font => <option key={font.value} value={font.value}>{font.label}</option>)}
                                    </select>
                                    <select value={paperSize} onChange={(e) => setPaperSize(e.target.value)} className="border border-slate-300 rounded-xl px-3 py-2.5 text-xs sm:text-sm font-bold bg-white outline-none focus:ring-2 focus:ring-blue-100 shadow-sm cursor-pointer">
                                        <option value="A4">A4</option><option value="B5">B5</option>
                                    </select>
                                </div>
                                <button onClick={() => { window.focus(); setTimeout(()=>window.print(), 50); }} className="bg-slate-800 text-white px-6 sm:px-8 py-2.5 rounded-xl font-bold shadow-xl flex items-center gap-2 hover:bg-slate-900 active:scale-95 transition-all w-full sm:w-auto justify-center"><Icon name="printer" size={18}/>印刷</button>
                            </div>
                        </div>
                    ) : (
                        <div className="max-w-6xl mx-auto mb-8 no-print sticky top-4 z-50 flex justify-center">
                            <button 
                                onClick={() => setIsPanelOpen(true)} 
                                className="bg-slate-800 text-white px-6 py-2.5 rounded-full font-bold shadow-xl flex items-center gap-2 hover:bg-slate-900 active:scale-95 transition-all opacity-80 hover:opacity-100"
                            >
                                <Icon name="settings" size={18} /> 操作パネルを表示 <Icon name="chevron-down" size={18} />
                            </button>
                        </div>
                    )}

                    <div className="flex flex-col items-center gap-12 pb-32">
                        {getPages().map((pageSections, pageIdx) => (
                            <div 
                                key={pageIdx}
                                className={`bg-white shadow-2xl relative worksheet-page transition-all duration-500
                                  ${paperSize === 'A4' ? 'w-[210mm] min-h-[297mm]' : 'w-[182mm] min-h-[257mm]'}
                                  ${overflows[pageIdx] ? 'ring-4 ring-red-400 ring-offset-4 ring-offset-slate-100' : ''}
                                  print:shadow-none print:m-0 print:break-after-page
                                `}
                                style={{ fontFamily: fontOptions.find(f => f.value === selectedFont).family }}
                            >
                                <div className="absolute -left-16 top-0 no-print flex flex-col items-center gap-1 font-sans">
                                    <span className="bg-slate-800 text-white w-12 h-12 rounded-full flex items-center justify-center font-bold shadow-lg text-lg">{pageIdx + 1}</span>
                                    <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Page</span>
                                </div>

                                <div className="p-12 sm:p-16 page-content h-full">
                                    {pageIdx === 0 && (
                                        <div className="mb-10 border-b-4 border-slate-800 pb-4 relative">
                                            {mode === 'edit' ? (
                                                <div className="bg-blue-50/50 p-4 rounded-2xl border border-blue-100">
                                                    <label className="block text-xs font-bold text-blue-600 mb-2 text-center">ワークシートのタイトル</label>
                                                    <input value={worksheetData.title || ''} onChange={e => updateData(d => d.title = e.target.value)} className="w-full text-2xl sm:text-3xl font-black text-center border border-slate-300 bg-white rounded-xl px-4 py-3 outline-none focus:ring-4 focus:ring-blue-200 shadow-sm transition-shadow" placeholder="タイトルを入力" />
                                                </div>
                                            ) : (
                                                <h2 className="text-2xl sm:text-3xl font-black text-center leading-tight text-slate-800">{worksheetData.title || ''}</h2>
                                            )}
                                            <div className="absolute -bottom-1 left-0 w-1/4 h-1 bg-slate-800"></div>
                                        </div>
                                    )}

                                    {pageSections.map((section) => {
                                        const sIdx = worksheetData.sections.findIndex(s => s.id === section.id);
                                        const is2Col = section.layout === '2-col';
                                        
                                        return (
                                            <div key={section.id} className={`relative mb-12 ${mode === 'edit' ? 'border-2 border-dashed border-emerald-300 rounded-3xl p-4 sm:p-6 bg-emerald-50/30 mb-16' : ''}`}>
                                                
                                                {mode === 'edit' && (
                                                    <div className="flex flex-wrap items-center justify-between gap-2 mb-6 bg-white p-3 rounded-2xl border border-emerald-200 shadow-sm font-sans">
                                                        <div className="flex items-center gap-3">
                                                            <span className="bg-emerald-500 text-white text-[10px] font-bold px-3 py-1.5 rounded-lg uppercase tracking-wider">大問 {sIdx + 1}</span>
                                                            <button onClick={() => toggleLayout(sIdx)} className={`px-3 py-1.5 border rounded-lg shadow-sm text-xs font-bold flex items-center gap-1.5 transition-all active:scale-95 ${is2Col ? 'bg-indigo-600 text-white border-indigo-700' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'}`}>
                                                                <Icon name={is2Col ? 'layout-list' : 'columns'} size={14}/> <span className="hidden sm:inline">{is2Col ? '1カラムに戻す' : '2カラムにする'}</span>
                                                            </button>
                                                        </div>
                                                        <div className="flex gap-1.5">
                                                            <button onClick={() => moveSection(sIdx, -1)} className="bg-white border border-slate-200 text-slate-600 p-2 rounded-lg shadow-sm hover:bg-slate-50 active:scale-95" title="大問を上へ"><Icon name="arrow-up" size={16}/></button>
                                                            <button onClick={() => moveSection(sIdx, 1)} className="bg-white border border-slate-200 text-slate-600 p-2 rounded-lg shadow-sm hover:bg-slate-50 active:scale-95" title="大問を下へ"><Icon name="arrow-down" size={16}/></button>
                                                            <button onClick={() => cloneSection(sIdx)} className="bg-white border border-blue-200 text-blue-600 p-2 rounded-lg shadow-sm hover:bg-blue-50 active:scale-95 ml-2" title="大問を複製"><Icon name="copy" size={16}/></button>
                                                            <button onClick={() => removeSection(sIdx)} className="bg-rose-50 text-rose-600 border border-rose-200 p-2 rounded-lg shadow-sm hover:bg-rose-100 active:scale-95" title="大問を削除"><Icon name="trash-2" size={16}/></button>
                                                        </div>
                                                    </div>
                                                )}

                                                <div className="flex items-start justify-between mb-6 pb-2 border-b-2 border-slate-800/10 mt-2 sm:mt-0">
                                                    <div className="flex-1">
                                                        {mode === 'edit' ? (
                                                            <div className="space-y-3 w-full bg-white p-5 rounded-2xl border border-slate-200 shadow-sm mb-4">
                                                                <div>
                                                                    <label className="block text-xs font-bold text-slate-500 mb-1.5">大問のタイトル</label>
                                                                    <input value={section.title || ''} onChange={e => updateData(d => d.sections[sIdx].title = e.target.value)} className="w-full text-lg sm:text-xl font-black border border-slate-300 bg-slate-50 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-emerald-300 focus:bg-white transition-colors" placeholder="見出しを入力" />
                                                                </div>
                                                                <div>
                                                                    <label className="block text-xs font-bold text-slate-500 mb-1.5">評価規準</label>
                                                                    <input value={section.criteria || ''} onChange={e => updateData(d => d.sections[sIdx].criteria = e.target.value)} className="w-full text-sm text-slate-600 font-bold border border-slate-300 bg-slate-50 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-emerald-300 focus:bg-white transition-colors" placeholder="評価の視点（例：【知技】〇〇を理解している）" />
                                                                </div>
                                                            </div>
                                                        ) : (
                                                            <div className="flex items-center gap-3 sm:gap-4">
                                                                <div className="bg-slate-800 text-white w-8 h-8 sm:w-10 sm:h-10 flex items-center justify-center rounded-xl sm:rounded-2xl text-lg sm:text-xl font-sans font-black shadow-lg shadow-slate-200 shrink-0">
                                                                    {sIdx + 1}
                                                                </div>
                                                                <div>
                                                                    <h3 className="text-lg sm:text-xl font-black text-slate-800">{section.title || ''}</h3>
                                                                    <span className="text-[9px] sm:text-[10px] font-bold text-slate-400 uppercase tracking-widest block mt-1 opacity-90">[{section.criteria || ''}]</span>
                                                                </div>
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                                
                                                <div className="transition-all duration-300">
                                                    {is2Col ? (
                                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-10 print:grid-cols-2 print:gap-10 relative">
                                                            <div className="flex flex-col">
                                                                {(section.leftBlocks || []).map((block, bIdx) => renderBlock(sIdx, bIdx, block, 'leftBlocks'))}
                                                                {mode === 'edit' && renderAddButtons(sIdx, 'leftBlocks')}
                                                            </div>
                                                            <div className="flex flex-col md:column-divider print:column-divider border-slate-200 pt-6 md:pt-0 print:pt-0 border-t border-dashed md:border-t-0 print:border-t-0">
                                                                {(section.rightBlocks || []).map((block, bIdx) => renderBlock(sIdx, bIdx, block, 'rightBlocks'))}
                                                                {mode === 'edit' && renderAddButtons(sIdx, 'rightBlocks')}
                                                            </div>
                                                        </div>
                                                    ) : (
                                                        <div className="flex flex-col">
                                                            {(section.blocks || []).map((block, bIdx) => renderBlock(sIdx, bIdx, block, 'blocks'))}
                                                            {mode === 'edit' && renderAddButtons(sIdx, 'blocks')}
                                                        </div>
                                                    )}
                                                </div>

                                                {mode !== 'edit' && sIdx < worksheetData.sections.length - 1 && (
                                                    <button onClick={() => togglePageBreak(section.id)} className={`absolute -bottom-10 left-1/2 -translate-x-1/2 no-print px-5 py-2.5 rounded-full text-xs font-black flex items-center gap-2 transition-all z-30 shadow-xl border-2 active:scale-95 ${pageBreaks.includes(section.id) ? 'bg-rose-500 text-white border-rose-600 scale-105' : 'bg-white text-slate-500 border-slate-200 hover:text-slate-700 hover:border-slate-300'}`}>
                                                        <Icon name="scissors" size={16}/>{pageBreaks.includes(section.id) ? '改ページを解除' : 'ここで改ページ'}
                                                    </button>
                                                )}
                                            </div>
                                        );
                                    })}

                                    {mode === 'edit' && (
                                        <div className="mt-12 flex justify-center font-sans pb-16">
                                            <button onClick={addSection} className="flex items-center gap-3 bg-slate-800 text-white border-none px-8 py-4 rounded-2xl font-black shadow-2xl hover:bg-slate-900 transition-all active:scale-95 group">
                                                <Icon name="plus" size={20} className="group-hover:rotate-90 transition-transform" /> 大問（セクション）を新規作成
                                            </button>
                                        </div>
                                    )}
                                </div>
                                
                                {overflows[pageIdx] && (
                                    <div className="absolute bottom-10 left-1/2 -translate-x-1/2 no-print flex items-center gap-3 bg-red-600 text-white px-8 py-3 rounded-full font-black shadow-2xl animate-bounce z-[60] border-4 border-white/20">
                                        <Icon name="alert-circle" size={20}/>
                                        ページ内容が溢れています
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
