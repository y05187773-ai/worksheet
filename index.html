<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教材設計エンジニア V5 - 2Column Support</title>
    <!-- React & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDKyokasho:wght@400;700&family=Klee+One:wght@400;600&family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@400;700&family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        @media print {
            .no-print { display: none !important; }
            .no-print-bg { background: white !important; }
            body { background: white; margin: 0; padding: 0; }
            .worksheet-page {
                box-shadow: none !important;
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
                height: 100vh !important;
                break-after: page !important;
            }
        }
        @page { margin: 0; }
        .write-box {
            border: 2px solid #cbd5e1;
            border-radius: 16px;
            width: 100%;
            background-color: #ffffff;
            position: relative;
            transition: height 0.2s ease-in-out;
        }
        .edit-border {
            border: 2px dashed #93c5fd;
            border-radius: 8px;
            padding: 8px;
            background-color: #eff6ff;
        }
        .column-divider {
            border-left: 1px dashed #cbd5e1;
            margin-left: 1rem;
            padding-left: 1rem;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icon = ({ name, size = 18, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current && window.lucide) {
                    iconRef.current.innerHTML = `<i data-lucide="${name}"></i>`;
                    window.lucide.createIcons({
                        root: iconRef.current,
                        attrs: { 'stroke-width': 2.5, width: size, height: size }
                    });
                }
            }, [name, size]);
            return <span ref={iconRef} className={`inline-flex items-center justify-center align-middle ${className}`}></span>;
        };

        const defaultData = {
            title: "社会科：国の政治「国会のはたらきと仕組み」",
            defaultPageBreaks: ["s2"],
            answers: {
                s1_1: "最高機関", s1_2: "立法機関", s2_1: "衆議院", s2_2: "参議院", s2_3: "二院制",
                box_diet_role: "（例）法律を作ることは、国民のルールを決めることなので、国民の代表が集まる国会が一番大切な役割を持っていると思う。",
                box_life_law: "【道路交通法】を選びました。この法律があるおかげで、車や歩行者が安全に道をとおることができます。",
                box_summary: "国会は、国民の代表が集まって法律や予算を決める「国の最高機関」であることを学んだ。"
            },
            sections: [
                {
                    id: "s1", title: "1. 国会の役割を調べよう", criteria: "【知技】国会の地位と役割を理解している。", layout: "1-col",
                    blocks: [
                        { type: "text", content: "憲法では、国会は「国の権力の（{{s1_1}}）」であり、国のみが法律を作ることができる「唯一の（{{s1_2}}）」であると定められています。", bold: false },
                        { type: "write_box", label: "なぜ国会は「国の最高機関」と呼ばれているのでしょうか？理由を考えて書きましょう。", boxId: "box_diet_role", defaultHeight: 120 }
                    ]
                },
                {
                    id: "s2", title: "2. 二つの議院の仕組み", criteria: "【知技】衆議院と参議院の仕組みを理解している。", layout: "2-col",
                    leftBlocks: [
                        { type: "text", content: "日本の国会は（{{s2_1}}）と（{{s2_2}}）の二つの議院から成り立っています。", bold: true },
                        { type: "keywords", words: ["国民の代表", "選挙", "話し合い", "慎重な審議"] }
                    ],
                    rightBlocks: [
                        { type: "text", content: "この仕組みを（{{s2_3}}）といいます。", bold: true },
                        { type: "bullets", items: ["衆議院：任期4年（解散あり）", "参議院：任期6年（解散なし）"] }
                    ]
                },
                {
                    id: "s3", title: "3. 法律と私たちの暮らし", criteria: "【思判表】法律が国民生活に果たす役割を考えている。", layout: "1-col",
                    blocks: [
                        { type: "quote", content: "国会では、毎年150本程度の新しい法律案が話し合われています。法律は、国民の権利を守り、社会の秩序を維持するために作られます。" },
                        { type: "write_box", label: "身近な法律を一つ選び、その法律が私たちの暮らしをどう守っているか書きましょう。", boxId: "box_life_law", defaultHeight: 180 }
                    ]
                },
                {
                    id: "s4", title: "4. まとめと振り返り", criteria: "本時の学習のまとめ", layout: "1-col",
                    blocks: [
                        { type: "write_box", label: "国会のはたらきについて、重要だと思ったことを中心にまとめましょう。", boxId: "box_summary", defaultHeight: 220 },
                        { type: "self_eval" }
                    ]
                }
            ]
        };

        const App = () => {
            const [worksheetData, setWorksheetData] = useState(defaultData);
            const [history, setHistory] = useState([JSON.parse(JSON.stringify(defaultData))]);
            const [historyIndex, setHistoryIndex] = useState(0);
            const [paperSize, setPaperSize] = useState('B5');
            const [mode, setMode] = useState('student');
            const [pageBreaks, setPageBreaks] = useState(defaultData.defaultPageBreaks || []);
            const [boxHeights, setBoxHeights] = useState({});
            const [overflows, setOverflows] = useState({});
            const [selectedFont, setSelectedFont] = useState('kyokasho');
            const fileInputRef = useRef(null);

            const fontOptions = [
                { value: 'kyokasho', label: '教科書体', family: "'BIZ UDKyokasho', 'BIZ UD教科書体', 'UD Digital Kyokasho NP-R', 'Meiryo', sans-serif" },
                { value: 'klee', label: 'Klee One (手書き風)', family: "'Klee One', 'BIZ UDKyokasho', 'Meiryo', sans-serif" },
                { value: 'gothic', label: 'ゴシック体', family: "'Noto Sans JP', 'Meiryo', sans-serif" },
                { value: 'mincho', label: '明朝体', family: "'Noto Serif JP', 'MS PMincho', serif" }
            ];

            useEffect(() => {
                const newHeights = {};
                const processBlocks = (blocks) => {
                    if(!blocks) return;
                    blocks.forEach(block => {
                        if (block.type === 'write_box') newHeights[block.boxId] = block.defaultHeight || 120;
                    });
                };
                worksheetData.sections.forEach(section => {
                    processBlocks(section.blocks);
                    processBlocks(section.leftBlocks);
                    processBlocks(section.rightBlocks);
                });
                setBoxHeights(prev => ({...newHeights, ...prev}));
            }, [worksheetData]);

            // ページ溢れ検知
            useEffect(() => {
                const timer = setTimeout(() => {
                    const pageElements = document.querySelectorAll('.worksheet-page');
                    const newOverflows = {};
                    pageElements.forEach((el, idx) => {
                        const content = el.querySelector('.page-content');
                        if (content && content.scrollHeight > el.clientHeight - 20) {
                            newOverflows[idx] = true;
                        }
                    });
                    setOverflows(newOverflows);
                }, 600);
                return () => clearTimeout(timer);
            }, [pageBreaks, paperSize, mode, boxHeights, worksheetData]);

            const updateData = (updater) => {
                const next = JSON.parse(JSON.stringify(worksheetData));
                updater(next);
                setWorksheetData(next);
                const newHistory = history.slice(0, historyIndex + 1);
                newHistory.push(JSON.parse(JSON.stringify(next)));
                if (newHistory.length > 50) newHistory.shift();
                setHistory(newHistory);
                setHistoryIndex(newHistory.length - 1);
            };

            const handleUndo = () => { if (historyIndex > 0) { const idx = historyIndex - 1; setHistoryIndex(idx); setWorksheetData(history[idx]); } };
            const handleRedo = () => { if (historyIndex < history.length - 1) { const idx = historyIndex + 1; setHistoryIndex(idx); setWorksheetData(history[idx]); } };
            const updateAnswer = (key, val) => updateData(d => { d.answers[key] = val; });
            
            const addBlock = (sIdx, type, col = 'blocks') => {
                updateData(d => {
                    const newId = `key_${Date.now()}`;
                    let newBlock = { type };
                    if (type === 'text') newBlock = { type, content: "新しいテキスト", bold: false, fontSize: "text-base", textAlign: "text-left" };
                    if (type === 'bullets') newBlock = { type, items: ["項目1", "項目2"] };
                    if (type === 'fill_in_box') newBlock = { type, label: "問い", answerKey: newId };
                    if (type === 'keywords') newBlock = { type, words: ["キーワード"] };
                    if (type === 'quote') newBlock = { type, content: "引用文" };
                    if (type === 'write_box') newBlock = { type, label: "問い", boxId: newId, defaultHeight: 120 };
                    
                    if (!d.sections[sIdx][col]) d.sections[sIdx][col] = [];
                    d.sections[sIdx][col].push(newBlock);
                    if (type === 'fill_in_box' || type === 'write_box') d.answers[newId] = "解答例";
                });
            };

            const removeBlock = (sIdx, bIdx, col = 'blocks') => updateData(d => { d.sections[sIdx][col].splice(bIdx, 1); });
            const moveBlock = (sIdx, bIdx, dir, col = 'blocks') => {
                updateData(d => {
                    const blocks = d.sections[sIdx][col];
                    if (dir === -1 && bIdx > 0) [blocks[bIdx-1], blocks[bIdx]] = [blocks[bIdx], blocks[bIdx-1]];
                    else if (dir === 1 && bIdx < blocks.length - 1) [blocks[bIdx], blocks[bIdx+1]] = [blocks[bIdx+1], blocks[bIdx]];
                });
            };

            const addSection = () => updateData(d => { d.sections.push({ id: `s_${Date.now()}`, title: "新しい大問", criteria: "評価規準", layout: "1-col", blocks: [] }); });
            const removeSection = (sIdx) => updateData(d => { d.sections.splice(sIdx, 1); });
            const moveSection = (sIdx, dir) => updateData(d => {
                if (dir === -1 && sIdx > 0) [d.sections[sIdx-1], d.sections[sIdx]] = [d.sections[sIdx], d.sections[sIdx-1]];
                else if (dir === 1 && sIdx < d.sections.length - 1) [d.sections[sIdx], d.sections[sIdx+1]] = [d.sections[sIdx+1], d.sections[sIdx]];
            });

            const toggleLayout = (sIdx) => updateData(d => {
                const s = d.sections[sIdx];
                if (s.layout === '2-col') {
                    s.blocks = [...(s.leftBlocks || []), ...(s.rightBlocks || [])];
                    s.leftBlocks = []; s.rightBlocks = []; s.layout = '1-col';
                } else {
                    s.leftBlocks = s.blocks || []; s.rightBlocks = []; s.blocks = []; s.layout = '2-col';
                }
            });

            const handleFileUpload = (e) => {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        if (data.sections && data.answers) { setWorksheetData(data); setHistory([JSON.parse(JSON.stringify(data))]); setHistoryIndex(0); }
                    } catch (err) { alert("JSON読み込み失敗"); }
                };
                reader.readAsText(file); e.target.value = '';
            };

            const handleDownloadJson = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ ...worksheetData, defaultPageBreaks: pageBreaks }, null, 2));
                const a = document.createElement('a'); a.href = dataStr; a.download = "worksheet_config.json"; a.click();
            };

            const renderTextWithBlanks = (text) => {
                if (!text) return "";
                const parts = text.split(/(\{\{[^}]+\}\})/g);
                return parts.map((part, i) => {
                    const match = part.match(/\{\{([^}]+)\}\}/);
                    if (match) {
                        const key = match[1];
                        return <span key={i} className={mode === 'teacher' ? 'text-red-600 font-bold px-2 underline' : 'border-b border-gray-400 px-10'}>{mode === 'teacher' ? ((worksheetData.answers && worksheetData.answers[key]) || '') : ''}</span>;
                    }
                    return <span key={i}>{part}</span>;
                });
            };

            const renderBlock = (sIdx, bIdx, block, col = 'blocks') => {
                if (mode === 'edit') {
                    return (
                        <div key={bIdx} className="edit-border mb-3 relative font-sans group/edit shadow-sm">
                            <div className="absolute top-1 right-1 flex gap-1 opacity-20 group-hover/edit:opacity-100 transition">
                                <button onClick={() => moveBlock(sIdx, bIdx, -1, col)} className="p-1 bg-white border rounded hover:bg-slate-100 flex items-center justify-center w-6 h-6"><Icon name="arrow-up" size={12}/></button>
                                <button onClick={() => moveBlock(sIdx, bIdx, 1, col)} className="p-1 bg-white border rounded hover:bg-slate-100 flex items-center justify-center w-6 h-6"><Icon name="arrow-down" size={12}/></button>
                                <button onClick={() => removeBlock(sIdx, bIdx, col)} className="p-1 bg-red-100 text-red-600 border border-red-200 rounded hover:bg-red-200 flex items-center justify-center w-6 h-6"><Icon name="trash-2" size={12}/></button>
                            </div>
                            <span className="text-[9px] bg-blue-100 text-blue-800 px-1.5 py-0.5 rounded font-bold uppercase mb-1.5 inline-block">{block.type}</span>
                            
                            {block.type === 'text' && (
                                <div className="space-y-2">
                                    <textarea value={block.content || ''} onChange={e => updateData(d => d.sections[sIdx][col][bIdx].content = e.target.value)} className="w-full border rounded p-1.5 text-xs" rows="2" placeholder="穴埋めは {{キー名}}"></textarea>
                                    <div className="flex flex-wrap items-center gap-3 text-[10px]">
                                        <label className="flex items-center gap-1"><input type="checkbox" checked={!!block.bold} onChange={e => updateData(d => d.sections[sIdx][col][bIdx].bold = e.target.checked)} /> 太字</label>
                                        <select value={block.fontSize || 'text-base'} onChange={e => updateData(d => d.sections[sIdx][col][bIdx].fontSize = e.target.value)} className="border rounded px-1 bg-white">
                                            <option value="text-xs">最小</option><option value="text-sm">小</option><option value="text-base">標準</option><option value="text-lg">大</option><option value="text-xl">特大</option>
                                        </select>
                                        <select value={block.textAlign || 'text-left'} onChange={e => updateData(d => d.sections[sIdx][col][bIdx].textAlign = e.target.value)} className="border rounded px-1 bg-white">
                                            <option value="text-left">左</option><option value="text-center">中</option><option value="text-right">右</option>
                                        </select>
                                    </div>
                                </div>
                            )}
                            {block.type === 'bullets' && <textarea value={(block.items || []).join('\n')} onChange={e => updateData(d => d.sections[sIdx][col][bIdx].items = e.target.value.split('\n'))} className="w-full border rounded p-1.5 text-xs" rows="2" placeholder="改行で区切る"></textarea>}
                            {block.type === 'fill_in_box' && (
                                <div className="space-y-1">
                                    <input value={block.label || ''} onChange={e => updateData(d => d.sections[sIdx][col][bIdx].label = e.target.value)} className="w-full border rounded p-1 text-xs" placeholder="問い" />
                                    <input value={(worksheetData.answers && worksheetData.answers[block.answerKey]) || ''} onChange={e => updateAnswer(block.answerKey, e.target.value)} className="w-full border rounded p-1 text-xs bg-red-50" placeholder="解答" />
                                </div>
                            )}
                            {block.type === 'keywords' && <input value={(block.words || []).join(', ')} onChange={e => updateData(d => d.sections[sIdx][col][bIdx].words = e.target.value.split(',').map(s=>s.trim()))} className="w-full border rounded p-1 text-xs" placeholder="語句1, 語句2" />}
                            {block.type === 'quote' && <textarea value={block.content || ''} onChange={e => updateData(d => d.sections[sIdx][col][bIdx].content = e.target.value)} className="w-full border rounded p-1.5 text-xs" rows="2"></textarea>}
                            {block.type === 'write_box' && (
                                <div className="space-y-1">
                                    <input value={block.label || ''} onChange={e => updateData(d => d.sections[sIdx][col][bIdx].label = e.target.value)} className="w-full border rounded p-1 text-xs" placeholder="記述の問い" />
                                    <textarea value={(worksheetData.answers && worksheetData.answers[block.boxId]) || ''} onChange={e => updateAnswer(block.boxId, e.target.value)} className="w-full border rounded p-1.5 text-xs bg-red-50" rows="1" placeholder="解答例"></textarea>
                                </div>
                            )}
                            {block.type === 'self_eval' && <div className="text-[10px] text-slate-400">自己評価ブロック</div>}
                        </div>
                    );
                }

                switch (block.type) {
                    case 'text': return <p key={bIdx} className={`mb-4 ${block.bold ? 'font-bold text-gray-700' : 'text-gray-800'} ${block.fontSize || 'text-base'} ${block.textAlign || 'text-left'} leading-relaxed`}>{renderTextWithBlanks(block.content || '')}</p>;
                    case 'bullets': return <div key={bIdx} className="grid grid-cols-1 gap-2 mb-4">{(block.items || []).map((item, i) => <div key={i} className="flex items-start gap-2"><span className="font-bold mt-1 text-slate-400">・</span><span>{renderTextWithBlanks(item)}</span></div>)}</div>;
                    case 'fill_in_box': return <div key={bIdx} className="mt-4 mb-4"><label className="block text-sm font-bold mb-2 italic">{block.label || ''}</label><div className="border-4 border-double border-gray-400 rounded-xl p-4 h-20 flex items-center justify-center text-2xl font-black tracking-[0.5em] bg-slate-50">（ <span className={mode === 'teacher' ? 'text-red-600' : ''}>{mode === 'teacher' ? ((worksheetData.answers && worksheetData.answers[block.answerKey]) || '') : '　　　　　'}</span> ）</div></div>;
                    case 'keywords': return <div key={bIdx} className="p-4 bg-slate-50 border border-dashed border-slate-300 rounded-xl flex items-center gap-4 mb-4 font-sans"><span className="text-xs font-bold text-slate-500 bg-slate-200 px-2 py-1 rounded">キーワード</span><div className="flex flex-wrap gap-2">{(block.words || []).map((w, i) => <span key={i} className="text-sm font-bold text-slate-700 bg-white px-2 py-0.5 rounded border shadow-sm">{w}</span>)}</div></div>;
                    case 'quote': return <div key={bIdx} className="bg-blue-50 p-4 rounded-xl border-l-8 border-blue-400 text-sm italic leading-loose shadow-sm mb-4">{block.content || ''}</div>;
                    case 'write_box': return <div key={bIdx} className="space-y-2 mt-4 mb-4"><p className="font-bold text-base leading-relaxed">{block.label || ''}</p><div className="write-box p-4 text-base leading-relaxed overflow-hidden group" style={{ height: `${boxHeights[block.boxId] || 120}px`, backgroundImage: 'linear-gradient(to bottom, transparent 95%, #f1f5f9 95%)', backgroundSize: '100% 1.4em' }}>{mode === 'teacher' && <span className="text-red-600">{(worksheetData.answers && worksheetData.answers[block.boxId]) || ''}</span>}<div className="absolute bottom-2 right-2 no-print flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity z-10 bg-white/80 p-1 rounded font-sans"><button onClick={() => setBoxHeights(p => ({...p, [block.boxId]: Math.max(60, p[block.boxId]-30)}))} className="bg-slate-200 rounded p-1 hover:bg-slate-300 flex items-center justify-center w-6 h-6"><Icon name="minus" size={14}/></button><button onClick={() => setBoxHeights(p => ({...p, [block.boxId]: (p[block.boxId]||120)+30}))} className="bg-slate-200 rounded p-1 hover:bg-slate-300 flex items-center justify-center w-6 h-6"><Icon name="plus" size={14}/></button></div></div></div>;
                    case 'self_eval': return <div key={bIdx} className="flex justify-between items-end mt-4 mb-2 font-sans"><div className="text-xs text-slate-400 font-bold flex gap-4"><span>自己評価： Ａ ・ Ｂ ・ Ｃ</span></div><div className="border-2 border-slate-300 w-24 h-16 flex flex-col items-center justify-center text-[10px] bg-white rounded-lg"><span className="font-bold text-slate-400">確認印</span></div></div>;
                    default: return null;
                }
            };

            const renderAddButtons = (sIdx, col) => (
                <div className="mt-2 p-2 bg-slate-50 border border-dashed border-slate-300 rounded flex flex-wrap gap-1 items-center font-sans no-print">
                    <span className="text-[10px] font-bold text-slate-400 mr-1">追加:</span>
                    {['text', 'bullets', 'fill_in_box', 'keywords', 'write_box'].map(type => (
                        <button key={type} onClick={()=>addBlock(sIdx, type, col)} className="text-[9px] bg-white border px-1.5 py-0.5 rounded hover:bg-slate-100">{type.replace('_box', '')}</button>
                    ))}
                </div>
            );

            const getPages = () => {
                const pages = []; let currentPage = [];
                worksheetData.sections.forEach((section) => {
                    currentPage.push(section);
                    if (pageBreaks.includes(section.id)) { pages.push(currentPage); currentPage = []; }
                });
                if (currentPage.length > 0) pages.push(currentPage); return pages;
            };

            const togglePageBreak = (id) => setPageBreaks(prev => prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]);

            return (
                <div className="p-4 sm:p-8 no-print-bg">
                    {/* 操作パネル */}
                    <div className="max-w-6xl mx-auto mb-8 bg-white p-4 rounded-2xl shadow-xl no-print border-b-4 border-slate-300 sticky top-4 z-50 font-sans flex flex-wrap items-center justify-between gap-4">
                        <div className="flex flex-col">
                            <h1 className="text-xl font-black text-slate-800 tracking-tight flex items-center gap-2"><Icon name="columns" className="text-blue-600" /> ワークシート職人 V5</h1>
                            <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest italic">2-Column Layout Support</span>
                        </div>
                        
                        <div className="flex items-center gap-4">
                            <div className="flex bg-slate-100 p-1 rounded-xl">
                                {['student', 'teacher', 'edit'].map(m => (
                                    <button key={m} onClick={() => setMode(m)} className={`px-4 py-1.5 rounded-lg text-sm font-bold transition ${mode === m ? 'bg-white shadow text-blue-600' : 'text-slate-500 hover:text-slate-700'}`}>
                                        {m === 'student' ? '生徒用' : m === 'teacher' ? '解答付' : '編集'}
                                    </button>
                                ))}
                            </div>
                            {mode === 'edit' && (
                                <div className="flex gap-1 bg-emerald-50 p-1 rounded-xl border border-emerald-100">
                                    <button onClick={handleUndo} disabled={historyIndex === 0} className={`p-1.5 rounded-lg transition flex items-center justify-center w-8 h-8 ${historyIndex === 0 ? 'text-emerald-200 cursor-not-allowed' : 'text-emerald-600 hover:bg-emerald-100'}`} title="Undo"><Icon name="undo" size={16}/></button>
                                    <button onClick={handleRedo} disabled={historyIndex === history.length - 1} className={`p-1.5 rounded-lg transition flex items-center justify-center w-8 h-8 ${historyIndex === history.length - 1 ? 'text-emerald-200 cursor-not-allowed' : 'text-emerald-600 hover:bg-emerald-100'}`} title="Redo"><Icon name="redo" size={16}/></button>
                                </div>
                            )}
                            <div className="flex gap-2">
                                <input type="file" ref={fileInputRef} onChange={handleFileUpload} accept=".json" className="hidden" />
                                <button onClick={() => fileInputRef.current.click()} className="px-3 py-1.5 bg-slate-100 rounded-lg text-sm font-bold text-slate-600 flex items-center gap-1 hover:bg-slate-200"><Icon name="upload" size={14}/>読込</button>
                                <button onClick={handleDownloadJson} className="px-3 py-1.5 bg-blue-50 border border-blue-200 rounded-lg text-sm font-bold text-blue-600 flex items-center gap-1 hover:bg-blue-100"><Icon name="download" size={14}/>保存</button>
                            </div>
                        </div>

                        <div className="flex gap-2">
                            <select value={selectedFont} onChange={(e) => setSelectedFont(e.target.value)} className="border rounded-lg px-2 py-1.5 text-sm font-bold bg-white">
                                {fontOptions.map(font => <option key={font.value} value={font.value}>{font.label}</option>)}
                            </select>
                            <select value={paperSize} onChange={(e) => setPaperSize(e.target.value)} className="border rounded-lg px-2 py-1.5 text-sm font-bold bg-white">
                                <option value="A4">A4</option><option value="B5">B5</option>
                            </select>
                            <button onClick={() => { window.focus(); setTimeout(()=>window.print(), 50); }} className="bg-slate-800 text-white px-5 py-1.5 rounded-xl font-bold shadow-lg hover:bg-slate-700 active:scale-95 transition"><Icon name="printer" size={14}/>印刷</button>
                        </div>
                    </div>

                    <div className="flex flex-col items-center gap-8 pb-20">
                        {getPages().map((pageSections, pageIdx) => (
                            <div 
                                key={pageIdx}
                                className={`bg-white shadow-2xl relative worksheet-page transition-all duration-300
                                  ${paperSize === 'A4' ? 'w-[210mm] min-h-[297mm]' : 'w-[182mm] min-h-[257mm]'}
                                  ${overflows[pageIdx] ? 'ring-4 ring-red-400' : ''}
                                  print:shadow-none print:m-0 print:break-after-page
                                `}
                                style={{ fontFamily: fontOptions.find(f => f.value === selectedFont).family }}
                            >
                                <div className="absolute -left-16 top-0 no-print flex flex-col items-center gap-1 font-sans">
                                    <span className="bg-slate-800 text-white w-10 h-10 rounded-full flex items-center justify-center font-bold shadow-lg">{pageIdx + 1}</span>
                                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">Page</span>
                                </div>

                                {mode === 'teacher' && <div className="absolute top-6 right-8 border-2 border-red-600 text-red-600 px-6 py-1 rounded-full font-black text-2xl rotate-[-5deg] z-50 opacity-30 select-none pointer-events-none">解答例</div>}

                                <div className="p-12 page-content h-full">
                                    {pageIdx === 0 && (
                                        <div className="mb-8 border-b-2 border-black pb-3">
                                            {mode === 'edit' ? (
                                                <input value={worksheetData.title || ''} onChange={e => updateData(d => d.title = e.target.value)} className="w-full text-2xl font-black text-center border-b-2 border-emerald-300 outline-none bg-emerald-50 px-2" placeholder="ワークシートのタイトル" />
                                            ) : (
                                                <h2 className="text-2xl font-black text-center leading-relaxed">{worksheetData.title || ''}</h2>
                                            )}
                                        </div>
                                    )}

                                    {pageSections.map((section) => {
                                        const sIdx = worksheetData.sections.findIndex(s => s.id === section.id);
                                        const is2Col = section.layout === '2-col';
                                        
                                        return (
                                            <div key={section.id} className={`relative mb-10 ${mode === 'edit' ? 'border-2 border-emerald-200 rounded-xl p-4 bg-white mb-12' : ''}`}>
                                                
                                                {mode === 'edit' && (
                                                    <div className="absolute -top-3 right-4 flex gap-1 font-sans z-10">
                                                        <button onClick={() => toggleLayout(sIdx)} className={`px-2 py-0.5 border rounded shadow-sm text-xs flex items-center gap-1 ${is2Col ? 'bg-blue-600 text-white border-blue-700' : 'bg-white text-slate-600 border-slate-300'}`}>
                                                            <Icon name={is2Col ? 'rows' : 'columns'} size={12}/> {is2Col ? '1段に戻す' : '2段にする'}
                                                        </button>
                                                        <button onClick={() => moveSection(sIdx, -1)} className="bg-white border border-slate-300 text-slate-600 px-2 py-0.5 rounded shadow-sm text-xs hover:bg-slate-50 flex items-center justify-center"><Icon name="arrow-up" size={12}/></button>
                                                        <button onClick={() => moveSection(sIdx, 1)} className="bg-white border border-slate-300 text-slate-600 px-2 py-0.5 rounded shadow-sm text-xs hover:bg-slate-50 flex items-center justify-center"><Icon name="arrow-down" size={12}/></button>
                                                        <button onClick={() => removeSection(sIdx)} className="bg-red-500 text-white px-2 py-0.5 rounded shadow-sm text-xs hover:bg-red-600 flex items-center gap-1"><Icon name="trash-2" size={12}/> 削除</button>
                                                    </div>
                                                )}

                                                <div className="flex items-start justify-between mb-4 pb-2 border-b-2 border-slate-100">
                                                    <div className="flex-1">
                                                        {mode === 'edit' ? (
                                                            <div className="space-y-2 w-full pr-4">
                                                                <input value={section.title || ''} onChange={e => updateData(d => d.sections[sIdx].title = e.target.value)} className="w-full text-xl font-black border-b border-dashed border-emerald-300 bg-emerald-50 outline-none" placeholder="タイトル" />
                                                                <input value={section.criteria || ''} onChange={e => updateData(d => d.sections[sIdx].criteria = e.target.value)} className="w-full text-xs text-slate-500 border-b border-dashed border-emerald-300 bg-emerald-50 outline-none" placeholder="評価規準" />
                                                            </div>
                                                        ) : (
                                                            <>
                                                                <h3 className="text-xl font-black flex items-center gap-3">
                                                                    <span className="bg-slate-800 text-white w-8 h-8 flex items-center justify-center rounded-xl text-base font-sans">{sIdx + 1}</span>
                                                                    {section.title || ''}
                                                                </h3>
                                                                <span className="text-[10px] font-bold text-slate-400 no-print italic block mt-1 ml-11 tracking-wider uppercase opacity-75">[{section.criteria || ''}]</span>
                                                            </>
                                                        )}
                                                    </div>
                                                </div>
                                                
                                                <div className={`rounded-xl transition-colors ${mode === 'teacher' ? 'bg-red-50/20' : ''}`}>
                                                    {is2Col ? (
                                                        <div className="grid grid-cols-2 gap-8 print:gap-8 relative">
                                                            <div className="flex flex-col">
                                                                {(section.leftBlocks || []).map((block, bIdx) => renderBlock(sIdx, bIdx, block, 'leftBlocks'))}
                                                                {mode === 'edit' && renderAddButtons(sIdx, 'leftBlocks')}
                                                            </div>
                                                            <div className="flex flex-col column-divider border-slate-200">
                                                                {(section.rightBlocks || []).map((block, bIdx) => renderBlock(sIdx, bIdx, block, 'rightBlocks'))}
                                                                {mode === 'edit' && renderAddButtons(sIdx, 'rightBlocks')}
                                                            </div>
                                                        </div>
                                                    ) : (
                                                        <div className="flex flex-col">
                                                            {(section.blocks || []).map((block, bIdx) => renderBlock(sIdx, bIdx, block, 'blocks'))}
                                                            {mode === 'edit' && renderAddButtons(sIdx, 'blocks')}
                                                        </div>
                                                    )}
                                                </div>

                                                {mode !== 'edit' && sIdx < worksheetData.sections.length - 1 && (
                                                    <button onClick={() => togglePageBreak(section.id)} className={`absolute -bottom-8 left-1/2 -translate-x-1/2 no-print px-4 py-1.5 rounded-full text-[10px] font-bold flex items-center gap-2 transition-all z-30 shadow-md font-sans ${pageBreaks.includes(section.id) ? 'bg-rose-500 text-white' : 'bg-white text-slate-500 border border-slate-200 hover:scale-105 active:scale-95'}`}>
                                                        <Icon name="scissors" size={14}/>{pageBreaks.includes(section.id) ? '改ページ解除' : 'ここで次頁へ'}
                                                    </button>
                                                )}
                                            </div>
                                        );
                                    })}

                                    {mode === 'edit' && (
                                        <div className="mt-8 flex justify-center font-sans pb-10">
                                            <button onClick={addSection} className="flex items-center gap-2 bg-emerald-100 text-emerald-700 border-2 border-emerald-300 px-6 py-3 rounded-xl font-bold shadow-sm hover:bg-emerald-200 transition active:scale-95">
                                                <Icon name="plus" size={18} /> 新しい大問（セクション）を追加
                                            </button>
                                        </div>
                                    )}
                                </div>
                                {overflows[pageIdx] && (
                                    <div className="absolute bottom-6 right-6 no-print flex items-center gap-2 bg-red-500 text-white px-4 py-2 rounded-lg font-bold animate-pulse shadow-lg font-sans">
                                        <Icon name="alert-triangle" size={18}/>
                                        入りきっていません（枠を狭めるか改ページしてください）
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
