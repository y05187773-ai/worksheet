5年,算数,1.整数と小数のしくみをまとめよう [整数と小数],1,整数と小数は十進位取り記数法で表され、0から9までの数字と小数点を使うとどんな大きさの数でも表せることを、位の数字が表す大きさを調べる活動を通して理解する。,「【思判表】整数の表し方（十進位取り記数法）を基に、小数の構成の表し方を考え、説明している。」,,,,,
5年,算数,1.整数と小数のしくみをまとめよう [整数と小数],2,小数の相対的な大きさを考え、0.001を単位として小数の構成を式に表したり、指定された数字と小数点を使って数をつくったりする。,「【思判表】小数について、0.001を単位として相対的な大きさを考え、説明している。」,,,,,
5年,算数,1.整数と小数のしくみをまとめよう [整数と小数],3,整数や小数を10倍、100倍、1000倍したときの、位の上がり方や小数点の位置の移り方を調べる。,「【知技】整数及び小数を10倍、100倍、1000倍した数をつくることができる。」,,,,,
5年,算数,1.整数と小数のしくみをまとめよう [整数と小数],4,整数や小数を1/10、1/100、1/1000にしたときの、位の下がり方や小数点の位置の移り方を調べる。,「【知技】整数や小数を1/10、1/100、1/1000にしたときの位の下がり方や小数点の位置の移り方を理解し、それらの数をつくることができる。」,,,,,
5年,算数,2.直方体や立方体のかさの比べ方と表し方を考えよう [直方体や立方体の体積],1,「体積」の意味と単位「立方センチメートル(cm3)」を理解し、積み木の数で大きさを比べる活動を通して、体積を数値化して比べる方法を考える。,「【知技】直方体や立方体の体積は、1cm3を単位としてその何こ分で表すことを理解している。」,,,,,
5年,算数,2.直方体や立方体のかさの比べ方と表し方を考えよう [直方体や立方体の体積],2,直方体や立方体の体積を計算で求める公式を理解し、一辺の長さなどの構成要素に着目して公式を導き、体積を求める。,「【思判表】単位となる大きさや、直方体や立方体の辺の長さに着目して、積の求め方を図や式を用いて考え、説明している。」,,,,,
5年,算数,2.直方体や立方体のかさの比べ方と表し方を考えよう [直方体や立方体の体積],3,直方体を組み合わせた立体の体積の求め方を、分割したり補ったりして既習の直方体や立方体の形を基に考える。,「【思判表】既習の直方体や立方体の形を基に、直方体を組み合わせた立体の体積の求め方を図や式を用いて考え、説明している。」,,,,,
5年,算数,2.直方体や立方体のかさの比べ方と表し方を考えよう [直方体や立方体の体積],4,大きな体積の単位「立方メートル(m3)」や1m3=1000000cm3の関係を理解し、量感を養う。,「【知技】大きなものの体積は、1m3を単位としてその何こ分で表すことを理解している。」,,,,,
5年,算数,2.直方体や立方体のかさの比べ方と表し方を考えよう [直方体や立方体の体積],5,「内のり」「容積」の意味や求め方、及び1L=1000cm3、1mL=1cm3の関係を、単位間の関係を整理しながら理解する。,「【知技】1L=1000cm3、1mL=1cm3の関係を理解している。」,,,,,
5年,算数,3.変わり方を調べよう(1) 〔比例],1,底面を固定して直方体の高さを変えたときの体積の変化を調べ、「比例」の関係（一方が2倍、3倍になるともう一方も2倍、3倍になる）を理解する。,「【知技】比例の関係について理解し、一方が2倍、3倍、…になると、もう一方も2倍、3倍、…になることを理解している。」,,,,,
5年,算数,3.変わり方を調べよう(1) 〔比例],2,比例の関係を使って、表にない部分の数値を求める方法を考え、比例の関係を使った問題解決の仕方を説明する。,「【思判表】比例の関係を使った体積の求め方を考え、説明している。」,,,,,
5年,算数,3.変わり方を調べよう(1) 〔比例],3,既習の乗法の場面を比例の関係ととらえ、数直線を用いて式の立て方や答えの求め方を考える。,「【思判表】比例の関係に着目して、数直線を使った式の立て方や答えの求め方を考え、説明している。」,,,,,
5年,算数,4.かけ算の世界を広げよう [小数のかけ算],1,乗数が小数の場合の乗法の意味を、「1とみたとき、○にあたる」という既習の倍の見方を活用してとらえ直す。,「【思判表】小数をかけることの意味について、既習の倍の見方を活用して考え、説明している。」,,,,,
5年,算数,4.かけ算の世界を広げよう [小数のかけ算],2,整数×小数の計算の仕方を、数直線や小数の構成、乗法の性質（10倍して計算し1/10にする等）に着目して考える。,「【知技】整数×小数の計算の仕方を、既習の計算や数直線を用いて考え、答えを求めることができる。」,,,,,
5年,算数,4.かけ算の世界を広げよう [小数のかけ算],3,小数×小数の筆算手順を乗法の性質を基に理解し、末尾の0の処理や0を補う場合も含めて確実に計算する。,「【知技】小数×小数の筆算の仕方を理解し、答えを求めることができる。」,,,,,
5年,算数,4.かけ算の世界を広げよう [小数のかけ算],4,純小数をかけると積が被乗数より小さくなる性質を、数直線や帯小数との比較を通して理解する。,「【知技】乗数が純小数の場合は、積が被乗数より小さくなることを理解している。」,,,,,
5年,算数,4.かけ算の世界を広げよう [小数のかけ算],5,整数について成り立つ交換・結合・分配法則が小数の場合でも成り立つことを、具体的な数値を代入して帰納的に確かめる。,「【思判表】小数の場合でも交換、結合、分配法則が成り立つことを、計算法則の式に小数を代入して考え、説明している。」,,,,,
5年,算数,5.わり算の世界を広げよう [小数のわり算],1,除数が小数の場合の除法の意味を、既習の倍の見方（1とみたとき○にあたる）を活用してとらえ直す。,「【思判表】小数でわることの意味について、既習の倍の見方を活用して考え、説明している。」,,,,,
5年,算数,5.わり算の世界を広げよう [小数のわり算],2,整数÷小数の計算の仕方を、数直線や除法の性質（わられる数とわる数に同じ数をかけても商は不変）を用いて、整数の計算に帰着して考える。,「【思判表】整数÷小数の計算の仕方を、小数の構成や除法の性質に着目して整数の計算に帰着して考え、説明している。」,,,,,
5年,算数,5.わり算の世界を広げよう [小数のわり算],3,小数÷小数の筆算の手順を、除法の性質を活用して小数点を移動させる方法などで理解し、計算する。,「【知技】小数÷小数の筆算の仕方を理解し、答えを求めることができる。」,,,,,
5年,算数,5.わり算の世界を広げよう [小数のわり算],4,純小数でわると商が被除数より大きくなる性質を、数直線を用いて考え、説明する。,「【知技】除数が純小数の場合は、商が被除数より大きくなることを理解している。」,,,,,
5年,算数,5.わり算の世界を広げよう [小数のわり算],5,割り切れないときの商の概数処理や、余りがある場合の余りの小数点の位置（被除数のもとの小数点に合わせる）について理解する。,「【知技】小数の除法の商を概数で表す方法や、余りの小数点の位置を理解している。」,,,,,
5年,算数,小数の倍,1,基準量や比較量が小数の場合の倍の意味を調べ、除法を用いて倍を求めたり、乗法を用いて比較量を求めたりする。,「【知技】基準量や比較量が小数の場合の倍の意味や簡単な割合による比較について理解し、基準量や比較量、倍を求めたり、割合で比較したりすることができる。」,,,,,
5年,算数,6.形も大きさも同じ図形を調べよう [合同な図形],1,「合同」の意味を理解し、対応する辺、角、頂点の長さや大きさが等しいという性質を調べる。,「【知技】合同な図形の性質について理解し、合同な図形の対応する辺の長さや角の大きさを求めたり、合同な図形を弁別したりすることができる。」,,,,,
5年,算数,6.形も大きさも同じ図形を調べよう [合同な図形],2,合同な三角形をかくために必要な条件（三辺、二辺夾角、二角夾辺）を考え、定規やコンパス、分度器を用いて作図する。,「【知技】合同な三角形のかき方を理解し、必要な構成要素を調べて合同な三角形をかくことができる。」,,,,,
5年,算数,6.形も大きさも同じ図形を調べよう [合同な図形],3,三角形の合同条件を活用し、対角線で分けることで合同な四角形がかけることを理解する。,「【知技】対角線で2つの三角形に分けて考え、合同な四角形をかくことができる。」,,,,,
5年,算数,7.図形の角を調べよう [図形の角],1,三角形の3つの角の和が180度になる性質を、角を切り取って一点に集めるなどの操作を通して帰納的に見いだし説明する。,「【思判表】三角形の角の大きさに着目して、内角の和の性質を見いだし、説明している。」,,,,,
5年,算数,7.図形の角を調べよう [図形の角],2,四角形を対角線で三角形に分けて考えることで、四角形の内角の和が360度になることを演繹的に導き出す。,「【思判表】三角形の内角の和を基にして、四角形の内角の和の求め方を演繹的に考え、説明している。」,,,,,
5年,算数,7.図形の角を調べよう [図形の角],3,「多角形」の内角の和を、三角形に分けることで求められる決まりを、表に整理して見いだす。,「【知技】多角形の内角の和は、三角形に分けることによって求められることを理解し、求めることができる。」,,,,,
5年,算数,8.整数の性質を調べよう [偶数と奇数、倍数と約数],1,整数を2でわったときの余りに着目して「偶数」「奇数」に類別し、2×□や2×□＋1の式で性質を説明する。,「【知技】偶数と奇数の意味を理解し、整数を偶数と奇数に類別することができる。」,,,,,
5年,算数,8.整数の性質を調べよう [偶数と奇数、倍数と約数],2,「倍数」「公倍数」「最小公倍数」の意味を理解し、公倍数は最小公倍数の倍数になっている性質を活用して公倍数を求める。,「【思判表】公倍数の意味や性質などに着目し、公倍数の求め方を考え、説明している。」,,,,,
5年,算数,8.整数の性質を調べよう [偶数と奇数、倍数と約数],3,「約数」「公約数」「最大公約数」の意味や性質を調べ、2つの数の公約数を求める方法を考える。,「【思判表】2つの数の約数に着目し、公約数の意味を考え、説明している。」,,,,,
5年,算数,9.分数と小数、整数の関係を調べよう [分数と小数、整数の関係],1,整数の除法の商（a÷b）は、分数（a/b）を用いて一つの数として表せることを理解する。,「【知技】整数の除法の商を分数で表したり、分数を整数の除法の式で表したりすることができる。」,,,,,
5年,算数,9.分数と小数、整数の関係を調べよう [分数と小数、整数の関係],2,分数倍の意味を「1とみたときに○にあたる」という既習の倍の意味と関連づけて統合的にとらえる。,「【思判表】分数倍の意味について、既習の整数倍や小数倍の意味と関連づけて考え、説明している。」,,,,,
5年,算数,9.分数と小数、整数の関係を調べよう [分数と小数、整数の関係],3,分数を整数の除法の式で表せることを活用して、分数、小数、整数の相互の書き換え方法を考える。,「【知技】分数を小数で表す方法を理解し、分数を小数や整数で表すことができる。」,,,,,
5年,算数,10.分数のたし算、ひき算を広げよう [分数のたし算とひき算],1,分母と分子に同じ数をかけたりわったりしても大きさは変わらない性質を基に、大きさの等しい分数をつくる。,「【思判表】大きさの等しい分数間にあるきまりを見いだし、大きさの等しい分数のつくり方を考え、説明している。」,,,,,
5年,算数,10.分数のたし算、ひき算を広げよう [分数のたし算とひき算],2,「約分」や「通分」の意味を理解し、最大公約数や最小公倍数を用いてそれらを行う方法をまとめる。,「【思判表】通分の仕方を、分母の最小公倍数に着目して考え、説明している。」,,,,,
5年,算数,10.分数のたし算、ひき算を広げよう [分数のたし算とひき算],3,異分母の分数の加減計算は、通分して分母をそろえれば計算できることを単位分数の意味に着目して理解する。,「【思判表】異分母の分数の加減計算の仕方を、単位分数の意味や分数の表現に着目して考え、説明している。」,,,,,
5年,算数,11.ならした大きさを考えよう [平均],1,「平均」の意味を理解し、凸凹をならす操作や「（合計）÷（個数）」の計算で平均を求める方法をまとめる。,「【知技】平均の意味と求め方を理解し、平均を計算で求めることができる。」,,,,,
5年,算数,12.比べ方を考えよう(1) [単位量あたりの大きさ],1,面積も匹数も異なる場合の混み具合を、面積をそろえて「1m2あたりの匹数」などで比べる方法（単位量当たりの大きさ）を理解する。,「【知技】単位量当たりの大きさを用いて比べることの意味を理解し、混み具合を比べることができる。」,,,,,
5年,算数,12.比べ方を考えよう(1) [単位量あたりの大きさ],2,「人口密度」の意味を理解し、単位量当たりの大きさの考えを用いて比較や問題解決を行う。,「【知技】人口密度の意味を理解し、人口密度を求めることができる。」,,,,,
5年,算数,12.比べ方を考えよう(1) [単位量あたりの大きさ],3,「速さ」を単位時間当たりの道のりとしてとらえ、速さ、道のり、時間の関係を式にまとめて未知の量を求める。,「【知技】速さを求める式を用いて、速さと時間から道のりを求める式を導き、道のりを求めることができる。」,,,,,
5年,算数,13.面積の求め方を考えよう [四角形と三角形の面積],1,平行四辺形の性質に着目し、既習の長方形に等積変形することで面積を求める公式を導き出し、適用する。,「【思判表】平行四辺形の性質に着目し、平行四辺形の面積の求め方を長方形の求積方法に帰着して考え、筋道立てて説明している。」,,,,,
5年,算数,13.面積の求め方を考えよう [四角形と三角形の面積],2,三角形を平行四辺形や長方形に倍積変形するなどの方法で、面積を求める公式を導き出し、底辺と高さの関係を理解する。,「【知技】三角形の底辺、高さの意味を理解し、面積の公式を用いて面積を求めることができる。」,,,,,
5年,算数,13.面積の求め方を考えよう [四角形と三角形の面積],3,台形やひし形の面積の求め方を、既習の三角形や長方形に帰着させて考え、それぞれの公式を導き出す。,「【思判表】台形の性質に着目し、台形の面積の求め方を平行四辺形や三角形の求積方法に帰着して考え、筋道立てて説明している。」,,,,,
5年,算数,14.比べ方を考えよう(2) 〔割合〕,1,割合の意味を理解し、2つの数量の関係を「割合＝比較量÷基準量」の式で求め、百分率(%)や歩合で表す。,「【知技】百分率や歩合による割合の表し方を理解し、割合を百分率で表したり、百分率で表された割合を小数で表したりすることができる。」,,,,,
5年,算数,14.比べ方を考えよう(2) 〔割合〕,2,比較量や基準量を求める場面（第2、第3用法）を、既習の倍の計算と関連づけて理解し解決する。,「【知技】基準量と割合から比較量を求めることができる。」,,,,,
5年,算数,14.比べ方を考えよう(2) 〔割合〕,3,割引や割増など、和や差を含んだ割合の場合の比較量の求め方を、図や式を用いて考える。,「【思判表】割引や割増の場面で、ひかれる金額や加える金額、割合に着目して解決の仕方を考え、説明している。」,,,,,
5年,算数,15.割合をグラフに表して調べよう [帯グラフと円グラフ],1,全体に対する各部分の割合を視覚的にとらえるのに便利な「帯グラフ」「円グラフ」の読み方や特徴を理解する。,「【知技】帯グラフ、円グラフの読み方を理解し、データの特徴や傾向を読み取ることができる。」,,,,,
5年,算数,15.割合をグラフに表して調べよう [帯グラフと円グラフ],2,目的に応じてデータを集計し、各項目の百分率を算出して帯グラフや円グラフをかく。,「【知技】帯グラフや円グラフのかき方を理解し、かくことができる。」,,,,,
5年,算数,16.変わり方を調べよう(2) [変わり方調べ],1,伴って変わる2つの数量の関係を調べ、規則性を見いだして□や○を使った式に表し、問題解決の方法を説明する。,「【知技】表や図を用いて、伴って変わる2つの数量の関係を見いだし、関係を式に表すことができる。」,,,,,
5年,算数,17.多角形と円をくわしく調べよう [正多角形と円周の長さ],1,「正多角形」の意味や性質を理解し、円の中心の周りの角を等分する方法などで正多角形を作図する。,「【知技】正多角形の意味や性質を理解している。」,,,,,
5年,算数,17.多角形と円をくわしく調べよう [正多角形と円周の長さ],2,円周と直径の長さの関係を調べ、「円周率」の意味や公式（円周＝直径×円周率）を理解して、円周の長さを求める。,「【知技】円周率の意味や求め方を理解し、円周率と円の直径や半径から、円周の長さを求めることができる。」,,,,,
5年,算数,18.立体をくわしく調べよう 〔角柱と円柱〕,1,「角柱」「円柱」の意味と、底面の位置関係、側面、頂点、辺の数などの構成要素の性質を調べる。,「【知技】角柱の意味や性質を理解している。」,,,,,
5年,算数,18.立体をくわしく調べよう 〔角柱と円柱〕,2,角柱や円柱の見取図や展開図のかき方を、構成要素のつながりや位置関係に着目して理解し作図する。,「【知技】角柱の展開図のかき方を理解し、展開図をかくことができる。」,,,,,
6年,算数,1.つり合いのとれた図形を調べよう [対称な図形],1,線対称な図形と対称の軸の意味を理解する。,「【知技】線対称な図形、対称の軸の意味を理解している。」,,,,,

1年,音楽,いろいろな おとをみつけよう,①,様々な打楽器の音を試し、音の特徴（音色や強弱）を生かして即興的に音をつなげたり簡単な音楽をつくったりする。,【知】打楽器の音や曲想と音色・強弱などの関わりに気付き、即興的に音を選びつなげたり簡単な音楽をつくったりする技能を身に付ける。【思】音色や強弱の働きを感じ取り、音楽づくりの発想を得る。,,,,,
1年,音楽,うたのまねっこであそぼう,①,「もりのくまさん」などの呼びかけとこたえの構造を楽しみ、交互に歌ったりリズムを打ったりする。,【知】曲想と呼びかけとこたえなど音楽の構造に気付き、声を合わせて歌ったり拍に合わせてリズム表現したりする技能を身に付ける。【思】フレーズや呼びかけとこたえを聴き取り、表現を工夫して歌う思いをもつ。,,,,,
1年,音楽,ねこのなきごえであそぼう,①,猫の鳴き声などの声色や強弱、呼びかけとこたえを意識して即興的に表現する。,【知】曲想と音色や強弱、呼びかけとこたえなどの関わりに気付き、即興的に声を選んでつなげる技能を身に付ける。【思】声による音遊びを通して音楽づくりの発想を得る。,,,,,
1年,音楽,おんがくのながれ,①,音楽の構造（反復や変化、合いの手など）を捉え、歌やリズムを楽しんだり、音の長さを工夫して鍵盤楽器を吹いたりする。,【知】曲想と旋律の反復・変化、合いの手、歌詞の内容やふさわしいアーティキュレーションに気付き、歌や楽器、音楽づくりの技能を身に付ける。【思】旋律、反復、変化、呼びかけとこたえなどを聴き取り、歌詞や曲想に合った表現を工夫する。,,,,,
1年,音楽,ほしのおんがくをつくろう,①,短い旋律をつくったり、できた旋律を友達とつなげたり重ねたりして簡単な音楽をつくる。,【知】旋律の特徴に気付き、即興的に音を選んだり、できた旋律を友達とつなげたり重ねたりして音楽をつくる技能を身に付ける。【思】旋律を聴き取り、その働きを感じながらどのように音を音楽にしていくかについて思いをもつ。,,,,,
2年,音楽,歌に合わせてリズムであそぼう (朝のリズム),①,互いの歌声や伴奏を聴きながら声を合わせて歌ったり、拍に合わせてリズム打ちをしたりする。,【知】曲想と旋律やリズムなど音楽の構造、歌詞の情景との関わりに気付き、声を合わせて歌う技能などを身に付ける。 【思】旋律やリズムの働きを感じ、どのように歌うかについて思いをもつ。 【態】音楽活動を楽しみ、主体的・協働的に取り組む。,,,,,
2年,音楽,はくにのってリズムであそぼう (はくにのって歌おう),①,拍を感じながら歌ったり、言葉のリズムで遊んだり、階名で模唱したりする。,【知】曲想とリズムや情景との関わりに気付き、即興的に音を選んだり階名で模唱したりする技能を身に付ける。 【思】リズムの働きを感じ、言葉とリズムの関わりや表現を工夫する思いをもつ。 【態】拍やリズム、階名に親しむ。,,,,,

2年,音楽,きょくのかんじがかわるところを見つけて歌おう,①,旋律や音色などの変化を聴き取り、自分の歌声や発音に気を付けて歌う。,【知】曲想と旋律や音色などの構造との関わりに気付き、発音に気を付けて歌う技能を身に付ける。 【思】旋律や音色の働きを感じ、曲想を感じ取って表現を工夫する。 【態】様々な音楽に親しむ。,,,,,
2年,音楽,どんな音がきこえるかな (どんな音やリズムがきこえてくるかな),①,楽器の音色に気を付けて演奏したり、歌詞に合った音色を工夫して表現したりする。,【知】曲想と音色の関わりに気付き、音色に気を付けて演奏する技能を身に付ける。 【思】音色やリズムの働きを感じ、どのように表すかについて思いをもったり、曲の楽しさを見いだしたりする。 【態】いろいろな打楽器に親しむ。,,,,,
2年,音楽,曲のかんじを 生かしてえんそうしよう,①,手の移動などの奏法を学び、旋律やフレーズ、反復を聴き取りながら演奏する。,【知】曲想とフレーズ、反復などの構造に気付き、階名で模唱したり伴奏を聴いて演奏したりする技能を身に付ける。 【思】旋律や反復の働きを感じ、曲想を感じ取って表現を工夫する。 【態】鍵盤楽器やドイツ民謡に親しむ。,,,,,

2年,音楽,音楽のながれ (いろいろな音やせんりつのうつりかわりを楽しもう),①,音色、旋律、反復、変化などを聴き取り、オーケストラの響きを味わって聴く。,【知】曲想と音色など音楽の構造との関わりに気付く。 【思】音色の働きが生み出すよさを感じ取り、曲全体を味わって聴く。 【態】標題音楽やオーケストラの響きに親しむ。,,,,,

5年,体育,水泳運動 (クロール),③,補助的な用具を使ったり、腕や脚の動きの呼吸との連動を意識したりして、長く泳げるようにする。,【知技】手足の動きの連携をとり、呼吸をしながら続けて長く泳ぐことができる。,,,,,
5年,体育,表現運動 (フォークダンス),④,日本の民謡や外国の踊りなど、ステップや踊り方の特徴を捉えて、友達と関わり合って踊る。,【知技】リズムの特徴を捉えて踊ったり、友達と動きを合わせたりして表現している。,,,,,
5年,体育,心の健康 (保健),⑤,心は生活経験を通して年齢に伴って発達することや、心と体は互いに影響し合っていることを理解する。,【知技】心の発達や心身の相関、不安や悩みへの対処法を理解している。,,,,,
5年,体育,心の健康 (保健),⑥,不安や悩みがあるときの対処法（大人への相談、軽い運動、深呼吸など）について、自分に合う方法を考える。,【思判表】心をよりよく発達させたり不安や悩みに対処したりする視点から、解決の方法を考え表現している。,,,,,
5年,体育,けがの防止 (保健),⑦,事故やけがの原因を「人の行動」と「環境」の両面から考え、危険を予測・回避する方法を話し合う。,【知技】交通事故や犯罪被害などの発生要因や防止方法を理解している。,,,,,
5年,体育,けがの防止 (保健),⑧,地震などの自然災害によるけがの防止や、けがをした際の簡単な手当（止血、冷却、固定など）を実習を通して身に付ける。,【思判表】危険の予測や回避をしたり、けがを手当したりする方法を考え、それらを表現している。,,,,,
6年,体育,器械運動 (跳び箱運動),①,自分の力に応じた切り返し跳びや、回転して跳び越すなどの基本的な技に安定して取り組む。,【知技】支持しての回転や、跳び越すなどの基本的な技を安定して行うことができる。,,,,,
6年,体育,陸上運動 (ハードル走),②,インターバルの歩数を一定に保ちながら、リズムよくハードルを跳び越して走り通す。,【知技】ハードルをリズミカルに跳び越し、一定の距離を走り通すことができる。,,,,,
6年,体育,ボール運動 (ベースボール型),③,攻守の役割を意識し、チームで協力して空いている場所を狙って打ったり、アウトを取ったりする。,【思判表】チームの課題に応じた作戦を考え、ルールを守って仲間と協力してゲームを行っている。,,,,,
6年,体育,表現運動 (表現),④,題材の特徴を捉えた変化のある動きを作り、群（グループ）での構成を工夫して表現する。,【知技】変化のある動きを組み合わせたり、友達と動きを合わせたりして表現している。,,,,,
6年,体育,病気の予防 (保健),⑤,病気は病原体、体の抵抗力、生活行動、環境が関わり合って起こる仕組みを理解する。,【知技】病原体による感染や生活習慣による病気の起こり方を理解している。,,,,,
6年,体育,病気の予防 (保健),⑥,感染症の予防（病原体の侵入防止、抵抗力向上）や、生活習慣病の予防に向けた望ましい生活習慣について考える。,【思判表】病気を予防する視点から解決の方法を考え、適切な方法を選び表現している。,,,,,
6年,体育,病気の予防 (保健),⑦,喫煙、飲酒、薬物乱用が心身に与える悪影響や、それらが社会的に禁止されている理由を理解する。,【知技】喫煙、飲酒、薬物乱用が健康を損なう大きな原因となることを理解している。,,,,,
6年,体育,地域の保健活動 (保健),⑧,保健所や病院など、地域で行われている保健活動の役割や、それらを自分の健康管理にどう生かすかを考える。,【思判表】病気を予防する視点から地域活動の利用を適切に選び、表現している。,,,,,
5年,外国語,Unit 1 自己紹介,①,自分の名前のつづりをたずね合う（How do you spell it?）。,【知】名前のつづりや好きなものに関する表現を理解している。,,,,,
5年,外国語,Unit 1 自己紹介,②,好きなもの（色、スポーツ、食べ物など）をたずね合う。,【技】自分の名前のつづりや好きなものについて話すことができる。,,,,,
5年,外国語,Unit 1 自己紹介,③,名刺を作って、名前や好きなことを伝える自己紹介を行う。,【思判表】友達と仲良くなるために、簡単な語句を用いて自己紹介をしている。,,,,,
5年,外国語,Unit 2 誕生日,①,誕生日（When is your birthday?）をたずね合う。,【知】誕生日や欲しいものに関する表現を理解している。,,,,,
5年,外国語,Unit 2 誕生日,②,誕生日に欲しいもの（What do you want for your birthday?）をたずね合う。,【思判表】互いをよく知るために、誕生日や欲しいものについて伝え合っている。,,,,,
5年,外国語,Unit 2 誕生日,③,友達の誕生日カードを作り、クラスの誕生日カレンダーを完成させる。,【態】互いをよく知るために、進んで誕生日などを伝え合おうとしている。,,,,,
5年,外国語,Unit 3 わたしの時間割,①,好きな教科（What subjects do you like?）をたずね合う。,【知】教科や曜日、時間割に関する表現を理解している。,,,,,
5年,外国語,Unit 3 わたしの時間割,②,各曜日の時間割（What do you have on Monday?）をたずね合う。,【技】好きな教科や時間割について話したり聞き取ったりできる。,,,,,
5年,外国語,Unit 3 わたしの時間割,③,「わたしの時間割」を作成し、自分の興味・関心について発表する。,【思判表】自分の興味・関心を伝えるために、時間割を作って発表している。,,,,,
5年,外国語,Unit 4 できること,①,できることやできないこと（Can you ? / I can.）をたずね合う。,【知】できること・できないことに関する表現を理解している。,,,,,
5年,外国語,Unit 4 できること,②,友達や先生ができること・できないことを紹介する（He/She can.）。,【技】人のできること・できないことについて聞き取ったり話したりできる。,,,,,
5年,外国語,Unit 4 できること,③,できることをヒントに、誰のことかを当てる「人当てクイズ」を行う。,【思判表】相手をよく知るために、基本的な表現を用いてクイズを作り発表している。,,,,,
5年,外国語,Unit 5 あこがれの人,①,人の職業や家族関係（He/She is my brother/a chef.）を伝える。,【知】職業や性格、家族を表す単語や表現を理解している。,,,,,
5年,外国語,Unit 5 あこがれの人,②,性格や人柄（He/She is active/kind.）を伝える言い方を知る。,【技】あこがれの人について職業や性格を話したり、紹介文を読んだりできる。,,,,,
5年,外国語,Unit 5 あこがれの人,③,「My Hero カード」を使い、自分のあこがれの人について発表する。,【思判表】興味・関心を伝えるために、あこがれの人の職業や性格について書いたり発表したりしている。,,,,,
5年,外国語,Unit 6 理想の町,①,ものがどこにあるか（Where is the library? / It's on/under/by.）をたずね合う。,【知】場所や位置、道案内に関する表現を理解している。,,,,,
5年,外国語,Unit 6 理想の町,②,道案内（Go straight. / Turn right.）の仕方を学び、場所への行き方を伝える。,【技】場所や道順について聞き取ったり、伝え合ったりできる。,,,,,
5年,外国語,Unit 6 理想の町,③,だれもが住みやすい「理想の町」を考え、地図を使って案内し合う。,【思判表】「理想の町」を考え、簡単な表現を用いて道案内をしている。,,,,,
5年,外国語,Unit 7 料理の注文,①,丁寧な言い方で料理を注文する（What would you like? / I'd like.）。,【知】料理の注文や値段に関する表現を理解している。,,,,,
5年,外国語,Unit 7 料理の注文,②,料理の値段（How much is it?）をたずねたり答えたりする。,【技】丁寧に注文したり、値段をたずね合ったりできる。,,,,,
5年,外国語,Unit 7 料理の注文,③,地域の名産品を使ったオリジナル料理を考え、店員と客になって注文し合う。,【思判表】オリジナル料理を考えて、メニュー表を使いながら注文し合っている。,,,,,
5年,外国語,Unit 8 町の紹介,①,町にあるもの（We have a zoo.）やお気に入りの場所を伝える。,【知】町にあるものや、そこでできることに関する表現を理解している。,,,,,
5年,外国語,Unit 8 町の紹介,②,町でできること（You can enjoy fishing.）を紹介し合う。,【技】町にあるものやできることについて話したり、紹介文を読んだりできる。,,,,,
5年,外国語,Unit 8 町の紹介,③,町の魅力を伝えるパンフレットを作り、自分たちの町について発表する。,【思判表】町の魅力を伝えるために、パンフレットを書いて紹介している。,,,,,
6年,外国語,Unit 1 自己紹介,①,出身国や住んでいる所（I'm from. / I live in.）を伝える。,【知】出身や得意なこと、興味に関する表現を理解している。,,,,,
6年,外国語,Unit 1 自己紹介,②,得意なことや興味のあること（I'm good at. / I'm interested in.）を伝え合う。,【技】内容を整理して自己紹介をする技能を身に付けている。,,,,,
6年,外国語,Unit 1 自己紹介,③,世界の友達に向けて、内容を整理して自己紹介のスピーチを行う。,【思判表】興味・関心を伝えるために、内容を整理して自己紹介をしている。,,,,,
6年,外国語,Unit 2 日本の行事,①,"好きな季節とその理由、季節の行事（In spring, we have.）を伝える。",【知】季節や行事、そこでできることに関する表現を理解している。,,,,,
6年,外国語,Unit 2 日本の行事,②,日本でできること（You can see/eat/visit.）を紹介し合う。,【技】季節の行事や日本でできることについて聞き取ったり話したりできる。,,,,,
6年,外国語,Unit 2 日本の行事,③,外国の人に興味をもってもらうために、日本の行事や文化について紹介する。,【思判表】日本の魅力を伝えるために、簡単な表現を用いて行事などを紹介している。,,,,,
6年,外国語,Unit 3 ふだんの生活,①,何時に何をするか（What time do you get up?）をたずね合う。,【知】時刻や日課、頻度（alwaysなど）に関する表現を理解している。,,,,,
6年,外国語,Unit 3 ふだんの生活,②,家でしている手伝いとその頻度（I always help my family.）について伝える。,【技】ふだんの生活について、伝え合ったり紹介文を読んだりできる。,,,,,
6年,外国語,Unit 3 ふだんの生活,③,自分の1日の生活の様子を紹介する文を書き、友達と読み合ってたずね合う。,【思判表】互いをよく知るために、ふだんの生活について書いたりたずね合ったりしている。,,,,,
6年,外国語,Unit 4 夏休みの思い出,①,夏休みにしたこと（What did you do in summer? / I went to.）をたずね合う。,【知】過去の行動や感想に関する表現を理解している。,,,,,
6年,外国語,Unit 4 夏休みの思い出,②,夏休みの思い出の感想（How was it? / It was great.）をたずね合う。,【技】過去の出来事や感想について、聞き取ったり話したりできる。,,,,,
6年,外国語,Unit 4 夏休みの思い出,③,夏休みの思い出を絵日記に書き、友達に向けて発表する。,【思判表】思い出を伝えるために、したことや感想について絵日記に書き発表している。,,,,,
6年,外国語,Unit 5 動物の気持ち,①,動物が何を食べるか（What do pandas eat?）を考えて伝え合う。,【知】動物や自然、生態に関する表現を理解している。,,,,,
6年,外国語,Unit 5 動物の気持ち,②,動物になりきって、住んでいる場所や特徴をヒントにクイズを出し合う。,【技】動物について、読んだり書いたりする技能を身に付けている。,,,,,
6年,外国語,Unit 5 動物の気持ち,③,動物の気持ち（絶滅の危機など）を考えるポスターを書き、友達と読み合う。,【思判表】動物の気持ちを伝えるために、簡単な表現を用いてポスターを書いている。,,,,,
6年,外国語,Unit 6 行ってみたい国,①,"世界の国でできること（In Italy, you can.）を紹介し合う。",【知】国名や、そこでできること、行きたい理由に関する表現を理解している。,,,,,
6年,外国語,Unit 6 行ってみたい国,②,行きたい国とその理由（I want to go to. / Why?）をたずね合う。,【技】行きたい国や理由について聞き取ったり、伝え合ったりできる。,,,,,
6年,外国語,Unit 6 行ってみたい国,③,旅行会社の人になって、世界の国々の魅力を客に紹介する。,【思判表】世界の魅力を伝えるために、できることなどを紹介したりやり取りしたりしている。,,,,,
6年,外国語,Unit 7 夢宣言,①,中学校で入りたい部活動（What club do you want to join?）を伝え合う。,【知】部活動や職業、将来の夢に関する表現を理解している。,,,,,
6年,外国語,Unit 7 夢宣言,②,将来つきたい職業とその理由（I want to be. / Because I like.）を伝える。,【技】将来の夢について、話したり読んだり書いたりできる。,,,,,
6年,外国語,Unit 7 夢宣言,③,中学校生活への抱負や将来の夢を整理して「夢宣言」として発表する。,【思判表】将来について考えるために、「夢宣言」を書いて発表している。,,,,,
6年,外国語,Unit 8 小学校の思い出,①,思い出に残った学校行事（What's your best memory?）を伝え合う。,【知】学校行事や過去の出来事に関する表現を理解している。,,,,,
6年,外国語,Unit 8 小学校の思い出,②,行事で行った場所やしたこと（We went to. / We saw.）を伝える。,【技】学校行事の思い出について聞き取ったり、話したりできる。,,,,,
6年,外国語,Unit 8 小学校の思い出,③,小学校生活の最高の思い出を構成を工夫して発表し、質問や感想を伝え合う。,【思判表】思い出を共有するために、行事の出来事や感想を発表したりやり取りしたりしている。,,,,,
1年,道徳,1 がっこう だいすき,①,学校で楽しいと感じることを出し合い、みんなが笑顔で過ごすために大切なことを考える。,【思】よりよい学校生活を送ることのよさに気づき、自分との関わりで考えている。,,,,,
1年,道徳,2 あいさつの ことば,①,挨拶をする理由を考え、相手に伝わる言い方や態度について話し合う。,【思】挨拶の大切さに気づき、相手や場面に合わせた挨拶について自分との関わりで考えている。,,,,,
1年,道徳,3 きもちの よい せいかつ,①,自分の一日を振り返り、時間を守ることや身の回りを整えることの大切さを考える。,【思】基本的な生活習慣を身につけることで快適に過ごせることに気づき、自分との関わりで考えている。,,,,,
1年,道徳,4 なかなおり,①,役割演技を通して、友達に素直に謝ることの大切さや仲直りの仕方を体験的に学ぶ。,【思】素直に謝ることの大切さに気づき、友達と仲よくすることについて自分との関わりで考えている。,,,,,
1年,道徳,5 これって いいのかな,①,学校や地域の約束やきまりを見つけ、それらがなぜあるのかについて話し合う。,【思】約束やきまりを守ることの大切さに気づき、多面的・多角的に考えている。,,,,,
1年,道徳,6 かぼちゃの つる,①,わがままにつるを伸ばしたかぼちゃの姿を通して、節度ある生活の大切さを考える。,【思】わがままをせず節度ある生活を送ることの大切さを理解し、自分との関わりで考えている。,,,,,
1年,道徳,7 ハッピーチェンジ,①,友達のよいところを見つけ、そのよさを伝えることで生まれる変化について考える。,【思】友達や自分のよいところを見つけることのよさに気づき、多面的・多角的に考えている。,,,,,
1年,道徳,8 おふろばそうじ,①,自分でやるべき仕事を最後までやり遂げるあきらの姿から、働くことのよさを考える。,【思】自分で決めたことをしっかりと行うことの大切さに気づき、自分との関わりで考えている。,,,,,
1年,道徳,9 おじいちゃん だいすき,①,家族との交流を考え、家族のために自分ができることや役に立つことを話し合う。,【思】家族とのつながりや家族のよさに気づき、家族のために進んで役に立とうと考えている。,,,,,
1年,道徳,10 くまさんのおちゃかい,①,嘘やごまかしをせず、素直に謝ることの大切さを、さるさんの行動から考える。,【思】嘘やごまかしをしないことのよさに気づき、誠実で明るい心で生活しようとしている。,,,,,
1年,道徳,11 にちようびの できごと,①,友達の家に行った時のマナーについて考え、礼儀正しくすることの大切さを話し合う。,【思】礼儀の大切さに気づき、相手を尊重するふるまいについて自分との関わりで考えている。,,,,,
1年,道徳,12 すてきな きょうしつ,①,みんなが楽しく過ごせる教室にするために、自分たちにできることを考える。,【思】友達とともに楽しい学校生活を送ることの大切さを理解し、自分との関わりで考えている。,,,,,
1年,道徳,13 二わの ことり,①,友達を思うことの大切さを、みそさざいとやまがらの交流を通して考える。,【思】友達のことを思う大切さに気づき、友達を大切にすることについて自分との関わりで考えている。,,,,,
1年,道徳,14 なんで いったのかな?,①,役割演技を通して、よいと思うことを進んで行う勇気や判断について考える。,【思】よいことと悪いことを区別し、よいと思うことを行う大切さを自分との関わりで考えている。,,,,,
1年,道徳,15 いっしょにあそぼう,①,仲間はずれについて考え、誰とでも仲よくすることの大切さについて話し合う。,【思】仲間はずれをしないことの大切さに気づき、みんなと仲よくすることについて考えている。,,,,,
1年,道徳,16 ダメ!,①,勇気をもって「ダメ」と言うことの大切さを考え、善悪を判断して行動する態度を育てる。,【思】よいと思うことを行う勇気の大切さに気づき、自分との関わりで考えている。,,,,,
1年,道徳,17 たのしかったハイキング,①,身近な自然に触れた経験から、自然のよさや動植物を大切にする気持ちを考える。,【思】自然の素晴らしさに気づき、動植物を大切にしようとすることについて自分との関わりで考えている。,,,,,

        const parseCSV = (text) => {
            if (!text || text.trim() === "") return [];
            const result = []; let row = []; let inQuotes = false; let field = '';
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                if (inQuotes) {
                    if (char === '"' && text[i + 1] === '"') { field += '"'; i++; }
                    else if (char === '"') inQuotes = false;
                    else field += char;
                } else {
                    if (char === '"') inQuotes = true;
                    else if (char === ',') { row.push(field); field = ''; }
                    else if (char === '\n' || (char === '\r' && text[i+1] === '\n')) {
                        if(char === '\r') i++;
                        row.push(field); result.push(row); row = []; field = '';
                    } else field += char;
                }
            }
            if (field || row.length > 0) { row.push(field); result.push(row); }
            if(result.length < 2) return [];
            const headers = result[0].map(h => h ? h.trim() : '');
            const data = [];
            for(let i=1; i<result.length; i++) {
                if(result[i].length === 1 && result[i][0].trim() === "") continue;
                const obj = {};
                for(let j=0; j<headers.length; j++) obj[headers[j] || `列${j}`] = result[i][j] || '';
                data.push(obj);
            }
            return data;
        };

        const rawCsvElement = document.getElementById('csv-data');

            // ドラッグ＆ドロップ用ステート

            const [showImportModal, setShowImportModal] = useState(false);

            const fontOptions = [

            const extractHeights = (data) => {

                        if (block.type === 'write_box') newHeights[block.boxId] = block.defaultHeight || 120;
                    });

                data.sections.forEach(section => {
                    processBlocks(section.blocks);
                    processBlocks(section.leftBlocks);

                return newHeights;
            };

            useEffect(() => { setBoxHeights(prev => ({...extractHeights(worksheetData), ...prev})); }, [worksheetData]);

            // プロンプト生成ロジック

・本時のめあて：${promptInputs.aim}
・評価規準：${promptInputs.criteria}

`;
                let formatInfo = "";
                if (promptType === 'worksheet') {
                    formatInfo = `【ワークシート設計の基本方針（レポート準拠）】
以下の「学習の三層構造」と「問いの階層」に基づいて、深い学びを促すワークシートを設計してください。

  "title": "${promptInputs.theme} ワークシート",
  "answers": { "key1": "解答例1", "box_ans": "記述の解答例" },
  "sections": [

                } else if (promptType === 'quiz') {
                    formatInfo = `【問題集設計の基本方針】
基礎的な知識・技能の定着を図るための問題集を設計してください。
・一問一答形式や、短い記述式問題を多めに配置する。

【出力要件】
上記の設計方針を反映し、以下のJSONフォーマットの例に厳密に従って出力してください。コードブロックやマークダウン装飾（\`\`\`json など）は絶対に含めず、純粋なJSON文字列のみを出力してください。
利用可能なブロックタイプ (type): 'aim_box', 'text', 'bullets', 'checkbox_group', 'fill_in_box', 'keywords', 'quote', 'write_box', 'self_eval'

{
  "title": "${promptInputs.theme} 問題集",
  "answers": { "q1": "解答例1", "q2": "解答例2", "box_q3": "記述の解答例" },
  "sections": [
    {
      "id": "s1",
      "title": "1. 基礎問題",
      "criteria": "知識・技能の定着",
      "layout": "1-col",
      "blocks": [
        { "type": "fill_in_box", "label": "次の問いに答えなさい。", "answerKey": "q1" },

  ]
}`;
                }
                setPromptText(base + formatInfo);
            };

            useEffect(() => { generatePrompt(); }, [promptInputs, promptType]);

            const handleCopyPrompt = () => {
                const textArea = document.createElement("textarea");
                textArea.value = promptText;
                textArea.style.position = "fixed";
                textArea.style.left = "-999999px";
                textArea.style.top = "-999999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    setCopyMessage("コピーしました！AIに貼り付けてください。");
                    setTimeout(() => setCopyMessage(""), 3000);
                } catch (err) {
                    console.error('Fallback: Oops, unable to copy', err);
                    setCopyMessage("コピーに失敗しました");
                }
                document.body.removeChild(textArea);
            };

            const updateData = (updater) => {
                const next = JSON.parse(JSON.stringify(worksheetData));
                updater(next);
                setWorksheetData(next);
                const newHistory = history.slice(0, historyIndex + 1);
                newHistory.push(JSON.parse(JSON.stringify(next)));
                if (newHistory.length > 50) newHistory.shift();
                setHistory(newHistory);
                setHistoryIndex(newHistory.length - 1);
            };

            const handleUndo = () => { if (historyIndex > 0) { const idx = historyIndex - 1; setHistoryIndex(idx); setWorksheetData(history[idx]); } };
            const handleRedo = () => { if (historyIndex < history.length - 1) { const idx = historyIndex + 1; setHistoryIndex(idx); setWorksheetData(history[idx]); } };
            const updateAnswer = (key, val) => updateData(d => { d.answers[key] = val; });

            // Drag & Drop Handlers
            const handleBlockDragStart = (e, sIdx, col, bIdx) => {
                e.stopPropagation(); setDragInfo({ type: 'block', sIdx, col, bIdx }); e.dataTransfer.effectAllowed = 'move';
            };
            const handleSectionDragStart = (e, sIdx) => {
                e.stopPropagation(); setDragInfo({ type: 'section', sIdx }); e.dataTransfer.effectAllowed = 'move';
            };
            const handleDragOver = (e) => { e.preventDefault(); e.stopPropagation(); };
            
            const handleBlockDrop = (e, targetSIdx, targetCol, targetBIdx) => {
                e.preventDefault(); e.stopPropagation();
                if (!dragInfo || dragInfo.type !== 'block') return;
                const { sIdx: sourceSIdx, col: sourceCol, bIdx: sourceBIdx } = dragInfo;
                if (sourceSIdx === targetSIdx && sourceCol === targetCol && sourceBIdx === targetBIdx) { setDragInfo(null); return; }
                updateData(d => {
                    const sourceList = d.sections[sourceSIdx][sourceCol];
                    const block = sourceList[sourceBIdx];
                    sourceList.splice(sourceBIdx, 1);
                    let insertIdx = targetBIdx;
                    if (sourceSIdx === targetSIdx && sourceCol === targetCol && sourceBIdx < targetBIdx) insertIdx -= 1;
                    const targetList = d.sections[targetSIdx][targetCol] || [];
                    targetList.splice(insertIdx, 0, block);
                    if (!d.sections[targetSIdx][targetCol]) d.sections[targetSIdx][targetCol] = targetList;
                });
                setDragInfo(null);
            };
            const handleSectionDrop = (e, targetSIdx) => {
                e.preventDefault(); e.stopPropagation();
                if (!dragInfo || dragInfo.type !== 'section') return;
                const sourceSIdx = dragInfo.sIdx;
                if (sourceSIdx === targetSIdx) { setDragInfo(null); return; }
                updateData(d => {
                    const section = d.sections[sourceSIdx];
                    d.sections.splice(sourceSIdx, 1);
                    let insertIdx = targetSIdx;
                    if (sourceSIdx < targetSIdx) insertIdx -= 1;
                    d.sections.splice(insertIdx, 0, section);
                });
                setDragInfo(null);
            };

                    if (type === 'text') newBlock = { type, content: "新しいテキスト", bold: false, fontSize: "text-base", textAlign: "text-left" };
                    if (type === 'bullets') newBlock = { type, items: ["項目1"] };
                    if (type === 'checkbox_group') newBlock = { type, label: "確認項目", items: ["チェック1"] };
                    if (type === 'fill_in_box') newBlock = { type, label: "問い", answerKey: newId };
                    if (type === 'keywords') newBlock = { type, words: ["キーワード"] };
                    if (type === 'quote') newBlock = { type, content: "引用文" };
                    if (type === 'write_box') newBlock = { type, label: "問い", boxId: newId, defaultHeight: 120, bgType: "lines" };
                    
                    if (!d.sections[sIdx][col]) d.sections[sIdx][col] = [];

                    if (type === 'fill_in_box' || type === 'write_box') d.answers[newId] = "解答例";

            };

            const cloneBlock = (sIdx, bIdx, col = 'blocks') => {
                updateData(d => {
                    const original = d.sections[sIdx][col][bIdx];

                    if (clone.boxId || clone.answerKey) {
                        const newId = `key_${Date.now()}`;
                        const oldId = clone.boxId || clone.answerKey;
                        if (clone.boxId) clone.boxId = newId;
                        if (clone.answerKey) clone.answerKey = newId;
                        d.answers[newId] = d.answers[oldId] || "";
                    }
                    d.sections[sIdx][col].splice(bIdx + 1, 0, clone);
                });

            const removeBlock = (sIdx, bIdx, col = 'blocks') => updateData(d => { d.sections[sIdx][col].splice(bIdx, 1); });

            const toggleLayout = (sIdx) => updateData(d => {
                const s = d.sections[sIdx];
                if (s.layout === '2-col') {
                    s.blocks = [...(s.leftBlocks || []), ...(s.rightBlocks || [])];
                    s.leftBlocks = []; s.rightBlocks = []; s.layout = '1-col';
                } else {
                    s.leftBlocks = s.blocks || []; s.rightBlocks = []; s.blocks = []; s.layout = '2-col';
                }
            });

            const handleImportJson = () => {
                if (!importText.trim()) { setImportError("JSONテキストを入力してください。"); return; }
                try {
                    const data = JSON.parse(importText);
                    if (data.sections && data.answers) { 
                        setWorksheetData(data); setHistory([JSON.parse(JSON.stringify(data))]); setHistoryIndex(0);
                        setPageBreaks(data.defaultPageBreaks || []); setBoxHeights(extractHeights(data));
                        setShowImportModal(false); setImportText(""); setImportError("");
                    } else setImportError("無効なデータ形式です。sectionsとanswersが必要です。");
                } catch (err) { setImportError("JSONの読み込みに失敗しました。形式が正しいか確認してください。"); }
            };

            const handleDownloadJson = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ ...worksheetData, defaultPageBreaks: pageBreaks }, null, 2));
                const a = document.createElement('a'); a.href = dataStr; a.download = `worksheet_${Date.now()}.json`; a.click();
            };

            // CSVデータ解析
            const availableGrades = [...new Set(planData.map(p => p['学年']?.trim()).filter(Boolean))];
            const availableSubjects = [...new Set(planData.map(p => (p['教科'] || p['教科名'])?.trim()).filter(Boolean))];
            const filteredPlans = planData.map((plan, index) => ({ plan, index })).filter(({ plan }) => {
                const grade = plan['学年']?.trim(); const subj = (plan['教科'] || plan['教科名'])?.trim();
                return (selectedPlanGrade === "" || grade === selectedPlanGrade) && (selectedPlanSubject === "" || subj === selectedPlanSubject);
            });

            useEffect(() => { setSelectedPlanIndex("-1"); }, [selectedPlanGrade, selectedPlanSubject, planData]);

            const renderTextWithBlanks = (text) => {
                if (!text) return "";
                const parts = text.split(/(\{\{[^}]+\}\})/g);
                return parts.map((part, i) => {
                    const match = part.match(/\{\{([^}]+)\}\}/);
                    if (match) {
                        const key = match[1];
                        return <span key={i} className={mode === 'teacher' ? 'text-red-600 font-bold px-2 underline decoration-red-300' : 'border-b border-gray-400 px-10'}>{mode === 'teacher' ? ((worksheetData.answers && worksheetData.answers[key]) || '') : ''}</span>;
                    }
                    const mathParts = part.split(/(\$\$[\s\S]+?\$\$|\$[\s\S]+?\$)/g);
                    return (
                        <span key={i}>
                            {mathParts.map((mathPart, j) => {
                                if (mathPart.startsWith('$$') && mathPart.endsWith('$$')) {
                                    const math = mathPart.slice(2, -2);
                                    if (window.katex) { try { return <span key={j} dangerouslySetInnerHTML={{ __html: window.katex.renderToString(math, { displayMode: true, throwOnError: false }) }} />; } catch (e) { return <span key={j}>{mathPart}</span>; } }
                                } else if (mathPart.startsWith('$') && mathPart.endsWith('$')) {
                                    const math = mathPart.slice(1, -1);
                                    if (window.katex) { try { return <span key={j} dangerouslySetInnerHTML={{ __html: window.katex.renderToString(math, { displayMode: false, throwOnError: false }) }} />; } catch (e) { return <span key={j}>{mathPart}</span>; } }
                                }
                                return <span key={j}>{mathPart}</span>;
                            })}
                        </span>
                    );
                });
            };

            const renderBlock = (sIdx, bIdx, block, col = 'blocks') => {
                const isDraggingThis = dragInfo?.type === 'block' && dragInfo.sIdx === sIdx && dragInfo.col === col && dragInfo.bIdx === bIdx;
                if (mode === 'edit') {
                    const info = blockInfo[block.type] || { label: block.type, icon: 'box' };
                    return (
                        <div key={bIdx} draggable onDragStart={(e) => handleBlockDragStart(e, sIdx, col, bIdx)} onDragOver={handleDragOver} onDrop={(e) => handleBlockDrop(e, sIdx, col, bIdx)} className={`mb-4 relative font-sans bg-white border rounded-xl overflow-hidden shadow-sm transition-all duration-200 ${isDraggingThis ? 'opacity-30 border-blue-500 scale-[0.98] shadow-inner' : 'border-slate-200 hover:shadow-md hover:border-slate-300'}`}>
                            <div className="flex items-center justify-between px-3 py-2 bg-slate-50 border-b border-slate-200 cursor-move" title="ドラッグして移動">
                                <div className="flex items-center gap-2 text-blue-600"><Icon name="grip-vertical" size={16} className="text-slate-400" /><Icon name={info.icon} size={16} /><span className="text-xs font-bold">{info.label}</span></div>
                                <div className="flex gap-1 opacity-60 hover:opacity-100">
                                    <button onClick={() => cloneBlock(sIdx, bIdx, col)} className="p-1.5 bg-white border border-blue-200 text-blue-600 rounded hover:bg-blue-50 shadow-sm ml-2 active:scale-95" title="複製"><Icon name="copy" size={14}/></button>
                                    <button onClick={() => removeBlock(sIdx, bIdx, col)} className="p-1.5 bg-white text-rose-600 border border-rose-200 rounded hover:bg-rose-50 shadow-sm active:scale-95" title="削除"><Icon name="x" size={14}/></button>
                                </div>
                            </div>
                            <div className="p-4">
                                {block.type === 'aim_box' && <div><label className="block text-[10px] font-bold text-slate-500 mb-1">めあての文章（数式は $x$ のように囲む）</label><textarea value={block.content || ''} onInput={autoResizeTextarea} onChange={e => updateData(d => d.sections[sIdx][col][bIdx].content = e.target.value)} className="auto-resize w-full border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 outline-none whitespace-pre-wrap"></textarea></div>}
                                {block.type === 'text' && <div className="space-y-3"><div><label className="block text-[10px] font-bold text-slate-500 mb-1">文章（穴埋め部分は {'{{答え}}'}、数式は $x$ のように囲む）</label><textarea value={block.content || ''} onInput={autoResizeTextarea} onChange={e => updateData(d => d.sections[sIdx][col][bIdx].content = e.target.value)} className="auto-resize w-full border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 outline-none whitespace-pre-wrap"></textarea></div><div className="flex gap-3 text-xs bg-slate-50 p-2 rounded-lg"><label><input type="checkbox" checked={!!block.bold} onChange={e => updateData(d => d.sections[sIdx][col][bIdx].bold = e.target.checked)}/> 太字</label></div></div>}
                                {block.type === 'bullets' && <div className="space-y-3"><label className="block text-[10px] font-bold text-slate-500 mb-1">リスト項目（数式は $x$ のように囲む）</label>{(block.items || []).map((item, i) => <div key={i} className="flex gap-2 items-start"><textarea value={item} onInput={autoResizeTextarea} onChange={e => updateData(d => { d.sections[sIdx][col][bIdx].items[i] = e.target.value; })} className="auto-resize flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm whitespace-pre-wrap" /><button onClick={() => updateData(d => { d.sections[sIdx][col][bIdx].items.splice(i, 1); })} className="text-rose-500 p-2"><Icon name="minus-circle" size={18}/></button></div>)}<button onClick={() => updateData(d => { d.sections[sIdx][col][bIdx].items.push("新項目"); })} className="text-blue-600 text-sm font-bold flex items-center gap-1.5 p-2"><Icon name="plus-circle" size={16}/> 追加</button></div>}
                                {block.type === 'checkbox_group' && <div className="space-y-3"><div><label className="block text-[10px] font-bold text-slate-500 mb-1">タイトル（数式は $x$ のように囲む）</label><input value={block.label || ''} onChange={e => updateData(d => d.sections[sIdx][col][bIdx].label = e.target.value)} className="w-full border border-slate-300 rounded-lg p-2.5 text-sm outline-none" /></div>{(block.items || []).map((item, i) => <div key={i} className="flex gap-2"><input value={item} onChange={e => updateData(d => { d.sections[sIdx][col][bIdx].items[i] = e.target.value; })} className="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none" /><button onClick={() => updateData(d => { d.sections[sIdx][col][bIdx].items.splice(i, 1); })} className="text-rose-500 p-2"><Icon name="minus-circle" size={18}/></button></div>)}<button onClick={() => updateData(d => { d.sections[sIdx][col][bIdx].items.push("新項目"); })} className="text-blue-600 text-sm font-bold flex items-center gap-1.5"><Icon name="plus-circle" size={16}/> 追加</button></div>}
                                {block.type === 'fill_in_box' && <div className="space-y-3"><div><label className="block text-[10px] font-bold text-slate-500 mb-1">問いの文章（数式は $x$ のように囲む）</label><input value={block.label || ''} onChange={e => updateData(d => d.sections[sIdx][col][bIdx].label = e.target.value)} className="w-full border border-slate-300 rounded-lg p-2.5 text-sm" /></div><div className="flex items-center gap-3 text-sm bg-red-50 p-3 rounded-lg"><span className="font-bold text-red-600">答え:</span><input value={(worksheetData.answers && worksheetData.answers[block.answerKey]) || ''} onChange={e => updateAnswer(block.answerKey, e.target.value)} className="flex-1 border-b-2 border-red-300 bg-transparent outline-none font-bold text-red-800" /></div></div>}
                                {block.type === 'write_box' && <div className="space-y-3"><div><label className="block text-[10px] font-bold text-slate-500 mb-1">記述の問い（数式は $x$ のように囲む）</label><textarea value={block.label || ''} onInput={autoResizeTextarea} onChange={e => updateData(d => d.sections[sIdx][col][bIdx].label = e.target.value)} className="auto-resize w-full border border-slate-300 rounded-lg p-2.5 text-sm whitespace-pre-wrap"></textarea></div><div className="flex items-center gap-2 p-2 bg-slate-50 rounded-lg"><span className="text-slate-500 font-bold text-xs">背景:</span><select value={block.bgType || 'lines'} onChange={e => updateData(d => d.sections[sIdx][col][bIdx].bgType = e.target.value)} className="border border-slate-300 rounded-md px-2 py-1 bg-white text-xs"><option value="lines">罫線</option><option value="grid_large">方眼(大)</option><option value="grid_medium">方眼(中)</option><option value="grid_small">方眼(小)</option><option value="blank">無地</option></select></div><div className="flex flex-col gap-2 bg-red-50 p-3 rounded-lg"><span className="font-bold text-red-600 text-[10px]">模範解答例:</span><textarea value={(worksheetData.answers && worksheetData.answers[block.boxId]) || ''} onInput={autoResizeTextarea} onChange={e => updateAnswer(block.boxId, e.target.value)} className="auto-resize w-full border border-red-200 rounded-lg p-3 bg-white outline-none text-red-700 font-bold whitespace-pre-wrap"></textarea></div></div>}
                                {block.type === 'keywords' && <div><label className="block text-[10px] font-bold text-slate-500 mb-1">ヒント語群（カンマ区切り）</label><input value={(block.words || []).join(', ')} onChange={e => updateData(d => d.sections[sIdx][col][bIdx].words = e.target.value.split(',').map(s=>s.trim()))} className="w-full border border-slate-300 rounded-lg p-2.5 text-sm" /></div>}
                                {block.type === 'quote' && <div><label className="block text-[10px] font-bold text-slate-500 mb-1">引用文・感想など（数式は $x$ のように囲む）</label><textarea value={block.content || ''} onInput={autoResizeTextarea} onChange={e => updateData(d => d.sections[sIdx][col][bIdx].content = e.target.value)} className="auto-resize w-full border border-slate-300 rounded-lg p-3 text-sm whitespace-pre-wrap"></textarea></div>}
                                {block.type === 'self_eval' && <div className="text-xs text-slate-400 font-bold bg-slate-100 p-3 rounded-lg text-center">（振り返り枠：設定項目なし）</div>}
                            </div>
                        </div>
                    );
                }

                switch (block.type) {
                    case 'aim_box': return <div key={bIdx} className="mb-6 p-4 sm:p-5 bg-white border-2 border-slate-800 rounded-xl relative shadow-sm mt-2"><div className="absolute -top-3.5 left-4 bg-slate-800 text-white text-xs font-black px-4 py-1.5 rounded-full flex gap-1.5"><Icon name="target" size={14}/>めあて</div><p className="font-bold text-lg sm:text-xl text-slate-800 leading-relaxed mt-2 text-center whitespace-pre-wrap">{renderTextWithBlanks(block.content || '')}</p></div>;
                    case 'text': return <div key={bIdx} className={`mb-4 ${block.bold ? 'font-bold text-slate-800' : 'text-slate-700'} ${block.fontSize || 'text-base'} ${block.textAlign || 'text-left'} leading-relaxed whitespace-pre-wrap`}>{renderTextWithBlanks(block.content || '')}</div>;
                    case 'bullets': return <div key={bIdx} className="grid grid-cols-1 gap-2 mb-4 text-base">{(block.items || []).map((item, i) => <div key={i} className="flex items-start gap-2"><span className="font-bold mt-1 text-slate-400">●</span><span className="whitespace-pre-wrap">{renderTextWithBlanks(item)}</span></div>)}</div>;
                    case 'checkbox_group': return <div key={bIdx} className="mb-6"><p className="font-bold text-sm text-slate-600 mb-3 flex items-center gap-2"><Icon name="check-square" size={16}/>{renderTextWithBlanks(block.label || '確認項目')}</p><div className="flex flex-col gap-2.5">{(block.items || []).map((item, i) => <label key={i} className="flex items-start gap-3 cursor-pointer group"><div className="w-5 h-5 border-2 border-slate-300 rounded mt-0.5"></div><span className="text-slate-700 whitespace-pre-wrap">{renderTextWithBlanks(item)}</span></label>)}</div></div>;
                    case 'fill_in_box': return <div key={bIdx} className="mt-4 mb-4"><label className="block text-sm font-bold mb-2 text-slate-500 italic">{renderTextWithBlanks(block.label || '')}</label><div className="border-4 border-double border-slate-300 rounded-xl p-4 h-20 flex items-center justify-center text-2xl font-black tracking-[0.5em] bg-slate-50">（ <span className={mode === 'teacher' ? 'text-red-600' : ''}>{mode === 'teacher' ? ((worksheetData.answers && worksheetData.answers[block.answerKey]) || '') : '　　　　　'}</span> ）</div></div>;
                    case 'keywords': return <div key={bIdx} className="p-4 bg-slate-50 border border-dashed border-slate-200 rounded-xl flex items-center gap-4 mb-4 font-sans"><span className="text-[10px] font-bold text-slate-400 bg-slate-100 px-2 py-1 rounded">ヒント</span><div className="flex flex-wrap gap-2">{(block.words || []).map((w, i) => <span key={i} className="text-sm font-bold text-slate-600 bg-white px-3 py-1 rounded-full border shadow-sm">{w}</span>)}</div></div>;
                    case 'quote': return <div key={bIdx} className="bg-slate-50/80 p-5 rounded-2xl border-l-4 border-slate-400 text-base leading-loose mb-6 text-slate-700 relative"><Icon name="quote" className="absolute top-3 left-3 text-slate-200 opacity-50" size={32}/><div className="relative z-10 whitespace-pre-wrap">{renderTextWithBlanks(block.content || '')}</div></div>;
                    case 'write_box': return <div key={bIdx} className="space-y-2 mt-4 mb-6"><p className="font-bold text-base text-slate-800 leading-relaxed whitespace-pre-wrap">{renderTextWithBlanks(block.label || '')}</p><div className={`write-box p-5 text-base leading-relaxed overflow-hidden group bg-${block.bgType || 'lines'}`} style={{ height: `${boxHeights[block.boxId] || 120}px` }}>{mode === 'teacher' && <span className="text-red-600 font-bold block fade-in relative z-10 whitespace-pre-wrap">{(worksheetData.answers && worksheetData.answers[block.boxId]) || ''}</span>}<div className="absolute bottom-2 right-2 no-print flex gap-2 opacity-0 group-hover:opacity-100 z-20 bg-white/95 p-1.5 rounded-xl border shadow-md font-sans"><button onClick={() => setBoxHeights(p => ({...p, [block.boxId]: Math.max(60, p[block.boxId]-28)}))} className="bg-slate-100 rounded-lg p-2 hover:bg-slate-200 text-slate-600"><Icon name="minus" size={16}/></button><button onClick={() => setBoxHeights(p => ({...p, [block.boxId]: (p[block.boxId]||120)+28}))} className="bg-slate-100 rounded-lg p-2 hover:bg-slate-200 text-slate-600"><Icon name="plus" size={16}/></button></div></div></div>;
                    case 'self_eval': return <div key={bIdx} className="flex justify-between items-end mt-8 mb-2 font-sans border-t-2 border-slate-100 pt-6"><div className="flex flex-col gap-2"><span className="text-xs text-slate-500 font-bold flex items-center gap-1.5"><Icon name="smile" size={16}/> ふり返り</span><div className="flex gap-4 text-[10px] text-slate-400 font-bold"><span>よくわかった(A)</span><span>だいたい(B)</span><span>もう少し(C)</span></div></div><div className="border-2 border-slate-200 w-24 h-16 flex flex-col items-center justify-center text-[10px] bg-slate-50 rounded-lg"><span className="font-bold text-slate-300">確認印</span></div></div>;
                    default: return null;
                }
            };

            const renderDropZone = (sIdx, col, bIdx) => {
                if (mode !== 'edit') return null;
                const isDragActive = dragInfo?.type === 'block';
                return <div onDragOver={handleDragOver} onDrop={(e) => handleBlockDrop(e, sIdx, col, bIdx)} className={`transition-all duration-200 rounded-xl ${isDragActive ? 'h-10 my-2 border-2 border-dashed border-blue-300 bg-blue-50/50 flex items-center justify-center' : 'h-2'}`}>{isDragActive && <span className="text-blue-500 text-xs font-bold pointer-events-none opacity-50">ここにドロップ</span>}</div>;
            };

            const getPages = () => {
                const pages = []; let currentPage = [];
                worksheetData.sections.forEach((section) => {
                    currentPage.push(section);
                    if (pageBreaks.includes(section.id)) { pages.push(currentPage); currentPage = []; }
                });
                if (currentPage.length > 0) pages.push(currentPage); return pages;
            };

            return (
                <div className="p-4 sm:p-8 no-print-bg">

                    {/* AIプロンプト生成モーダル */}
                    {showPromptModal && (
                        <div className="fixed inset-0 bg-slate-900/40 flex items-center justify-center z-[100] p-4 font-sans backdrop-blur-sm transition-opacity">
                            <div className="bg-white rounded-3xl shadow-2xl max-w-4xl w-full max-h-[90vh] flex flex-col overflow-hidden animate-[fadeIn_0.2s_ease-out]">
                                <div className="flex items-center justify-between p-6 border-b border-slate-100 bg-slate-50">
                                    <h2 className="text-xl font-black text-slate-800 flex items-center gap-2">
                                        <Icon name="sparkles" className="text-purple-500"/> AIプロンプト作成・コピー
                                    </h2>
                                    <button onClick={() => setShowPromptModal(false)} className="p-2 bg-white border border-slate-200 text-slate-500 hover:bg-slate-100 hover:text-slate-800 rounded-full transition-colors"><Icon name="x"/></button>
                                </div>
                                <div className="p-6 flex-1 overflow-y-auto flex flex-col gap-4">
                                    <p className="text-sm text-slate-600 font-bold mb-2">生成AI（ChatGPTやClaudeなど）に貼り付けるプロンプトを作成します。内容を修正してからコピーできます。</p>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">学年・教科</label>
                                            <input value={promptInputs.gradeSubject} onChange={e => setPromptInputs({...promptInputs, gradeSubject: e.target.value})} className="w-full border border-slate-300 rounded-lg p-2.5 text-sm outline-none focus:border-purple-400" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">単元名・教材名</label>
                                            <input value={promptInputs.theme} onChange={e => setPromptInputs({...promptInputs, theme: e.target.value})} className="w-full border border-slate-300 rounded-lg p-2.5 text-sm outline-none focus:border-purple-400" />
                                        </div>
                                        <div className="md:col-span-2">
                                            <label className="block text-xs font-bold text-slate-500 mb-1">本時のめあて・学習活動</label>
                                            <input value={promptInputs.aim} onChange={e => setPromptInputs({...promptInputs, aim: e.target.value})} className="w-full border border-slate-300 rounded-lg p-2.5 text-sm outline-none focus:border-purple-400" />
                                        </div>
                                        <div className="md:col-span-2">
                                            <label className="block text-xs font-bold text-slate-500 mb-1">評価規準</label>
                                            <input value={promptInputs.criteria} onChange={e => setPromptInputs({...promptInputs, criteria: e.target.value})} className="w-full border border-slate-300 rounded-lg p-2.5 text-sm outline-none focus:border-purple-400" />
                                        </div>
                                    </div>
                                    
                                    <div className="flex gap-2 mt-2">
                                        <button onClick={() => setPromptType('worksheet')} className={`px-4 py-2 rounded-lg text-sm font-bold transition-colors ${promptType==='worksheet'?'bg-purple-100 text-purple-700':'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>ワークシートモード</button>
                                        <button onClick={() => setPromptType('quiz')} className={`px-4 py-2 rounded-lg text-sm font-bold transition-colors ${promptType==='quiz'?'bg-purple-100 text-purple-700':'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>問題集モード</button>
                                    </div>

                                    <div className="relative mt-2 flex-1 min-h-[200px] flex flex-col">
                                        <label className="block text-xs font-bold text-purple-600 mb-1 flex items-center gap-1"><Icon name="bot" size={14}/> 以下のテキストをコピーしてAIに指示を出してください</label>
                                        <textarea 
                                            value={promptText}
                                            onChange={e => setPromptText(e.target.value)}
                                            className="w-full flex-1 border border-purple-200 rounded-xl p-4 text-sm font-mono focus:ring-2 focus:ring-purple-300 outline-none resize-none bg-purple-50/30 whitespace-pre-wrap"
                                        ></textarea>
                                    </div>
                                </div>
                                <div className="p-4 bg-slate-50 border-t border-slate-100 flex justify-end gap-3 items-center">
                                    {copyMessage && <span className="text-emerald-600 font-bold text-sm flex items-center gap-1 mr-auto pl-2"><Icon name="check-circle" size={18}/> {copyMessage}</span>}
                                    <button onClick={() => setShowPromptModal(false)} className="bg-white text-slate-600 border border-slate-300 font-bold px-6 py-2.5 rounded-xl hover:bg-slate-50 transition-colors">閉じる</button>
                                    <button onClick={handleCopyPrompt} className="bg-purple-600 text-white font-bold px-8 py-2.5 rounded-xl hover:bg-purple-700 transition-colors shadow-lg flex items-center gap-2 active:scale-95">
                                        <Icon name="copy" size={18}/> コピーする
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* JSONインポートモーダル */}
                    {showImportModal && (
                        <div className="fixed inset-0 bg-slate-900/40 flex items-center justify-center z-[100] p-4 font-sans backdrop-blur-sm transition-opacity">
                            <div className="bg-white rounded-3xl shadow-2xl max-w-4xl w-full max-h-[90vh] flex flex-col overflow-hidden animate-[fadeIn_0.2s_ease-out]">
                                <div className="flex items-center justify-between p-6 border-b border-slate-100 bg-slate-50">
                                    <h2 className="text-xl font-black text-slate-800 flex items-center gap-2"><Icon name="file-json" className="text-blue-500"/> JSONデータ読み込み</h2>
                                    <button onClick={() => setShowImportModal(false)} className="p-2 bg-white border border-slate-200 text-slate-500 hover:bg-slate-100 rounded-full"><Icon name="x"/></button>
                                </div>
                                <div className="p-6 flex-1 overflow-hidden flex flex-col gap-4">
                                    <p className="text-sm text-slate-600 font-bold">AIが出力したJSONテキストを貼り付けてください。<span className="text-rose-600">※現在の内容は上書きされます。</span></p>
                                    <textarea value={importText} onChange={e => {setImportText(e.target.value); setImportError("");}} className="w-full flex-1 border border-slate-300 rounded-xl p-4 text-sm font-mono focus:ring-2 focus:ring-blue-200 outline-none resize-none bg-slate-50 min-h-[300px]" placeholder='{"title": "...", "sections": [...]}'></textarea>
                                    {importError && <div className="bg-rose-50 text-rose-600 px-4 py-3 rounded-lg text-sm font-bold border border-rose-200 flex items-center gap-2"><Icon name="alert-circle" size={18}/> {importError}</div>}
                                </div>
                                <div className="p-4 bg-slate-50 border-t border-slate-100 flex justify-end gap-3">
                                    <button onClick={() => setShowImportModal(false)} className="bg-white text-slate-600 border border-slate-300 font-bold px-6 py-2.5 rounded-xl hover:bg-slate-50">キャンセル</button>
                                    <button onClick={handleImportJson} className="bg-blue-600 text-white font-bold px-8 py-2.5 rounded-xl hover:bg-blue-700 flex items-center gap-2"><Icon name="upload" size={18}/> 読み込む</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* CSV連携 検索パネル */}
                    {isPanelOpen && planData.length > 0 && (
                        <div className="max-w-6xl mx-auto mb-4 bg-white p-4 sm:px-6 sm:py-4 rounded-2xl shadow-sm border border-slate-200 no-print flex flex-wrap gap-4 items-end font-sans transition-all">
                            <div className="flex items-center gap-2 text-slate-700 font-black w-full mb-1 border-b pb-2"><Icon name="database" size={18} className="text-emerald-600"/> 指導計画データベースからプロンプトを作成</div>
                            <div className="flex-1 min-w-[120px]">
                                <label className="block text-xs font-bold text-slate-500 mb-1">学年</label>
                                <select value={selectedPlanGrade} onChange={e => setSelectedPlanGrade(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-slate-50">
                                    <option value="">すべて</option>{availableGrades.map(g => <option key={g} value={g}>{g}</option>)}
                                </select>
                            </div>
                            <div className="flex-1 min-w-[120px]">
                                 <label className="block text-xs font-bold text-slate-500 mb-1">教科</label>
                                 <select value={selectedPlanSubject} onChange={e => setSelectedPlanSubject(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-slate-50">
                                    <option value="">すべて</option>{availableSubjects.map(s => <option key={s} value={s}>{s}</option>)}
                                </select>
                            </div>
                            <div className="flex-[3] min-w-[280px]">
                                <label className="block text-xs font-bold text-slate-500 mb-1">学習活動を選択してプロンプト自動生成</label>
                                <select value={selectedPlanIndex} onChange={e => {
                                    setSelectedPlanIndex(e.target.value);
                                    if (e.target.value !== "-1") {
                                        const plan = planData[e.target.value];
                                        setPromptInputs({
                                            gradeSubject: `${plan['学年']||''} ${plan['教科'] || plan['教科名']||''}`.trim(),
                                            theme: plan['単元名・教材名'] || plan['単元名'] || '',
                                            aim: plan['学習活動内容'] || '',
                                            criteria: plan['評価規準'] || ''
                                        });
                                        setShowPromptModal(true);
                                    }
                                }} className="w-full border border-emerald-300 rounded-lg px-3 py-2 text-sm bg-emerald-50 outline-none focus:ring-2 focus:ring-emerald-400 font-bold text-emerald-800 cursor-pointer shadow-sm">
                                    <option value="-1">-- 単元や活動を選択してください --</option>
                                    {filteredPlans.map(({plan, index}) => (
                                        <option key={index} value={index}>
                                            {plan['単元名・教材名'] || plan['単元名']} - 活動{plan['活動番号']} : {(plan['学習活動内容']||'').substring(0,30)}...
                                        </option>
                                    ))}
                                </select>
                            </div>
                        </div>
                    )}

                    {/* 操作パネル */}
                    {isPanelOpen ? (
                        <div className="max-w-6xl mx-auto mb-8 bg-white p-4 sm:p-5 rounded-3xl shadow-2xl no-print border border-slate-200 sticky top-4 z-50 font-sans flex flex-wrap items-center justify-between gap-5 relative transition-all duration-300">
                            <button onClick={() => setIsPanelOpen(false)} className="absolute -top-3 -right-3 bg-slate-800 text-white rounded-full p-2 shadow-lg hover:bg-slate-700 transition-colors z-50" title="パネルを隠す"><Icon name="chevron-up" size={18} /></button>
                            <div className="flex flex-col">
                                <h1 className="text-xl sm:text-2xl font-black text-slate-800 tracking-tight flex items-center gap-2"><Icon name="layout-template" className="text-blue-500" /> 教材設計エンジニア V10.8</h1>
                            </div>
                            <div className="flex flex-wrap items-center gap-3">
                                <div className="flex bg-slate-100 p-1.5 rounded-2xl shadow-inner">
                                    {['student', 'teacher', 'edit'].map(m => (
                                        <button key={m} onClick={() => setMode(m)} className={`px-4 sm:px-6 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition-all duration-200 ${mode === m ? 'bg-white shadow-md text-blue-600 scale-[1.02]' : 'text-slate-500 hover:text-slate-700'}`}>
                                            {m === 'student' ? '生徒用' : m === 'teacher' ? '解答付' : '編集モード'}
                                        </button>
                                    ))}
                                </div>
                                <div className="hidden sm:block w-px h-10 bg-slate-200 mx-2"></div>
                                <div className="flex gap-2 w-full sm:w-auto mt-2 sm:mt-0">
                                    <button onClick={() => setShowPromptModal(true)} className="flex-1 sm:flex-none px-4 py-2.5 bg-purple-50 text-purple-600 rounded-xl border border-purple-200 text-xs sm:text-sm font-bold flex items-center justify-center gap-2 hover:bg-purple-100 active:scale-95 transition-transform"><Icon name="sparkles" size={16}/>AIプロンプト</button>
                                    <button onClick={() => {setShowImportModal(true); setImportText(""); setImportError("");}} className="flex-1 sm:flex-none px-4 py-2.5 bg-slate-50 text-slate-600 rounded-xl border border-slate-200 text-xs sm:text-sm font-bold flex items-center justify-center gap-2 hover:bg-slate-100 active:scale-95 transition-transform"><Icon name="file-json" size={16}/>JSON読込</button>
                                    <button onClick={handleDownloadJson} className="flex-1 sm:flex-none px-4 py-2.5 bg-blue-50 text-blue-600 rounded-xl border border-blue-200 text-xs sm:text-sm font-bold flex items-center justify-center gap-2 hover:bg-blue-100 active:scale-95 transition-transform"><Icon name="save" size={16}/>保存</button>
                                </div>
                            </div>
                            <div className="flex flex-wrap items-center gap-3 w-full lg:w-auto justify-end">
                                {mode === 'edit' && (
                                    <div className="flex gap-2 mr-2">
                                        <button onClick={handleUndo} disabled={historyIndex === 0} className={`p-2.5 rounded-xl border transition flex items-center justify-center ${historyIndex === 0 ? 'bg-slate-50 text-slate-300 border-slate-100' : 'bg-emerald-50 text-emerald-600 border-emerald-200 hover:bg-emerald-100 shadow-sm active:scale-95'}`} title="元に戻す"><Icon name="undo-2" size={18}/></button>
                                        <button onClick={handleRedo} disabled={historyIndex === history.length - 1} className={`p-2.5 rounded-xl border transition flex items-center justify-center ${historyIndex === history.length - 1 ? 'bg-slate-50 text-slate-300 border-slate-100' : 'bg-emerald-50 text-emerald-600 border-emerald-200 hover:bg-emerald-100 shadow-sm active:scale-95'}`} title="やり直す"><Icon name="redo-2" size={18}/></button>
                                    </div>
                                )}
                                <div className="flex gap-2">
                                    <select value={selectedFont} onChange={(e) => setSelectedFont(e.target.value)} className="border border-slate-300 rounded-xl px-3 py-2.5 text-xs sm:text-sm font-bold bg-white outline-none focus:ring-2 focus:ring-blue-100 shadow-sm cursor-pointer">
                                        {fontOptions.map(font => <option key={font.value} value={font.value}>{font.label}</option>)}
                                    </select>
                                    <select value={paperSize} onChange={(e) => setPaperSize(e.target.value)} className="border border-slate-300 rounded-xl px-3 py-2.5 text-xs sm:text-sm font-bold bg-white outline-none focus:ring-2 focus:ring-blue-100 shadow-sm cursor-pointer">
                                        <option value="A4">A4</option><option value="B5">B5</option>
                                    </select>
                                </div>
                                <button onClick={() => { window.focus(); setTimeout(()=>window.print(), 50); }} className="bg-slate-800 text-white px-6 sm:px-8 py-2.5 rounded-xl font-bold shadow-xl flex items-center gap-2 hover:bg-slate-900 active:scale-95 transition-all w-full sm:w-auto justify-center"><Icon name="printer" size={18}/>印刷</button>
                            </div>
                        </div>
                    ) : (
                        <div className="max-w-6xl mx-auto mb-8 no-print sticky top-4 z-50 flex justify-center">
                            <button onClick={() => setIsPanelOpen(true)} className="bg-slate-800 text-white px-6 py-2.5 rounded-full font-bold shadow-xl flex items-center gap-2 hover:bg-slate-900 active:scale-95 transition-all opacity-80 hover:opacity-100"><Icon name="settings" size={18} /> 操作パネルを表示 <Icon name="chevron-down" size={18} /></button>
                        </div>
                    )}

                    {/* ワークシート本体 */}
                    <div className="flex flex-col items-center gap-12 pb-32">
                        {getPages().map((pageSections, pageIdx) => (
                            <div 
                                key={pageIdx}
                                className={`bg-white shadow-2xl relative worksheet-page transition-all duration-500
                                  ${paperSize === 'A4' ? 'w-[210mm] min-h-[297mm]' : 'w-[182mm] min-h-[257mm]'}
                                  ${overflows[pageIdx] ? 'ring-4 ring-red-400 ring-offset-4 ring-offset-slate-100' : ''}
                                  print:shadow-none print:m-0 print:break-after-page
                                `}
                                style={{ fontFamily: fontOptions.find(f => f.value === selectedFont).family }}
                            >
                                <div className="absolute -left-16 top-0 no-print flex flex-col items-center gap-1 font-sans">
                                    <span className="bg-slate-800 text-white w-12 h-12 rounded-full flex items-center justify-center font-bold shadow-lg text-lg">{pageIdx + 1}</span>
                                </div>

                                <div className="p-12 sm:p-16 page-content h-full">
                                    {pageIdx === 0 && (
                                        <div className="mb-10 border-b-4 border-slate-800 pb-4 relative">
                                            {mode === 'edit' ? (
                                                <div className="bg-blue-50/50 p-4 rounded-2xl border border-blue-100">
                                                    <label className="block text-xs font-bold text-blue-600 mb-2 text-center">ワークシートのタイトル</label>
                                                    <input value={worksheetData.title || ''} onChange={e => updateData(d => d.title = e.target.value)} className="w-full text-2xl sm:text-3xl font-black text-center border border-slate-300 bg-white rounded-xl px-4 py-3 outline-none focus:ring-4 focus:ring-blue-200 shadow-sm transition-shadow" placeholder="タイトルを入力" />
                                                </div>
                                            ) : (
                                                <h2 className="text-2xl sm:text-3xl font-black text-center leading-tight text-slate-800 whitespace-pre-wrap">{worksheetData.title || ''}</h2>
                                            )}
                                            <div className="absolute -bottom-1 left-0 w-1/4 h-1 bg-slate-800"></div>
                                        </div>
                                    )}

                                    {pageSections.map((section) => {
                                        const sIdx = worksheetData.sections.findIndex(s => s.id === section.id);
                                        const is2Col = section.layout === '2-col';
                                        const isDraggingSection = dragInfo?.type === 'section' && dragInfo.sIdx === sIdx;
                                        
                                        return (
                                            <div 
                                                key={section.id} 
                                                draggable={mode === 'edit'}
                                                onDragStart={(e) => mode === 'edit' && handleSectionDragStart(e, sIdx)}
                                                onDragOver={handleDragOver}
                                                onDrop={(e) => handleSectionDrop(e, sIdx)}
                                                className={`relative mb-12 transition-all ${mode === 'edit' ? `border-2 border-dashed border-emerald-300 rounded-3xl p-4 sm:p-6 bg-emerald-50/30 mb-16 ${isDraggingSection ? 'opacity-30 scale-[0.98]' : ''}` : ''}`}
                                            >
                                                {mode === 'edit' && (
                                                    <div className="flex flex-wrap items-center justify-between gap-2 mb-6 bg-white p-3 rounded-2xl border border-emerald-200 shadow-sm font-sans cursor-move" title="大問をドラッグして移動">
                                                        <div className="flex items-center gap-3">
                                                            <Icon name="grip-horizontal" size={20} className="text-slate-400" />
                                                            <span className="bg-emerald-500 text-white text-[10px] font-bold px-3 py-1.5 rounded-lg uppercase tracking-wider">大問 {sIdx + 1}</span>
                                                            <button onClick={(e) => { e.stopPropagation(); toggleLayout(sIdx); }} className={`px-3 py-1.5 border rounded-lg shadow-sm text-xs font-bold flex items-center gap-1.5 transition-all active:scale-95 ${is2Col ? 'bg-indigo-600 text-white border-indigo-700' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'}`}>
                                                                <Icon name={is2Col ? 'layout-list' : 'columns'} size={14}/> <span className="hidden sm:inline">{is2Col ? '1カラムに戻す' : '2カラムにする'}</span>
                                                            </button>
                                                        </div>
                                                        <div className="flex gap-1.5 opacity-60 hover:opacity-100">
                                                            <button onClick={(e) => { e.stopPropagation(); removeSection(sIdx); }} className="bg-rose-50 text-rose-600 border border-rose-200 p-2 rounded-lg shadow-sm hover:bg-rose-100 active:scale-95" title="大問を削除"><Icon name="trash-2" size={16}/></button>
                                                        </div>
                                                    </div>
                                                )}

                                                <div className="flex items-start justify-between mb-6 pb-2 border-b-2 border-slate-800/10 mt-2 sm:mt-0">
                                                    <div className="flex-1">
                                                        {mode === 'edit' ? (
                                                            <div className="space-y-3 w-full bg-white p-5 rounded-2xl border border-slate-200 shadow-sm mb-4" onDragStart={e => e.preventDefault()}>
                                                                <div>
                                                                    <label className="block text-xs font-bold text-slate-500 mb-1.5">大問のタイトル</label>
                                                                    <input value={section.title || ''} onChange={e => updateData(d => d.sections[sIdx].title = e.target.value)} className="w-full text-lg sm:text-xl font-black border border-slate-300 bg-slate-50 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-emerald-300 focus:bg-white transition-colors" placeholder="見出しを入力" />
                                                                </div>
                                                                <div>
                                                                    <label className="block text-xs font-bold text-slate-500 mb-1.5">評価規準</label>
                                                                    <input value={section.criteria || ''} onChange={e => updateData(d => d.sections[sIdx].criteria = e.target.value)} className="w-full text-sm text-slate-600 font-bold border border-slate-300 bg-slate-50 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-emerald-300 focus:bg-white transition-colors" placeholder="評価の視点（例：【知技】〇〇を理解している）" />
                                                                </div>
                                                            </div>
                                                        ) : (
                                                            <div className="flex items-center gap-3 sm:gap-4">
                                                                <div className="bg-slate-800 text-white w-8 h-8 sm:w-10 sm:h-10 flex items-center justify-center rounded-xl sm:rounded-2xl text-lg sm:text-xl font-sans font-black shadow-lg shadow-slate-200 shrink-0">{sIdx + 1}</div>
                                                                <div>
                                                                    <h3 className="text-lg sm:text-xl font-black text-slate-800 whitespace-pre-wrap">{section.title || ''}</h3>
                                                                    <span className="text-[9px] sm:text-[10px] font-bold text-slate-400 uppercase tracking-widest block mt-1 opacity-90">[{section.criteria || ''}]</span>
                                                                </div>
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                                
                                                <div className="transition-all duration-300">
                                                    {is2Col ? (
                                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-10 print:grid-cols-2 print:gap-10 relative">
                                                            <div className="flex flex-col min-h-[100px]">
                                                                {(section.leftBlocks || []).map((block, bIdx) => renderBlock(sIdx, bIdx, block, 'leftBlocks'))}
                                                                {renderDropZone(sIdx, 'leftBlocks', section.leftBlocks?.length || 0)}
                                                                {mode === 'edit' && <div className="mt-2 text-center"><button onClick={()=>addBlock(sIdx, 'write_box', 'leftBlocks')} className="text-xs font-bold text-blue-500 border border-dashed border-blue-300 bg-blue-50 px-4 py-2 rounded-lg hover:bg-blue-100 transition-colors w-full"><Icon name="plus" size={14} className="inline"/> ブロック追加</button></div>}
                                                            </div>
                                                            <div className="flex flex-col min-h-[100px] md:column-divider print:column-divider border-slate-200 pt-6 md:pt-0 print:pt-0 border-t border-dashed md:border-t-0 print:border-t-0">
                                                                {(section.rightBlocks || []).map((block, bIdx) => renderBlock(sIdx, bIdx, block, 'rightBlocks'))}
                                                                {renderDropZone(sIdx, 'rightBlocks', section.rightBlocks?.length || 0)}
                                                                {mode === 'edit' && <div className="mt-2 text-center"><button onClick={()=>addBlock(sIdx, 'write_box', 'rightBlocks')} className="text-xs font-bold text-blue-500 border border-dashed border-blue-300 bg-blue-50 px-4 py-2 rounded-lg hover:bg-blue-100 transition-colors w-full"><Icon name="plus" size={14} className="inline"/> ブロック追加</button></div>}
                                                            </div>
                                                        </div>
                                                    ) : (
                                                        <div className="flex flex-col min-h-[100px]">
                                                            {(section.blocks || []).map((block, bIdx) => renderBlock(sIdx, bIdx, block, 'blocks'))}
                                                            {renderDropZone(sIdx, 'blocks', section.blocks?.length || 0)}
                                                            {mode === 'edit' && (
                                                                <div className="mt-4 p-4 bg-blue-50/50 border border-dashed border-blue-200 rounded-2xl flex flex-wrap gap-2 items-center font-sans no-print justify-center sm:justify-start">
                                                                    <span className="text-xs font-bold text-blue-500 mr-2 flex items-center gap-1.5"><Icon name="plus-circle" size={18}/> ブロック追加:</span>
                                                                    {Object.entries(blockInfo).map(([type, info]) => (
                                                                        <button key={type} onClick={()=>addBlock(sIdx, type, 'blocks')} className="text-xs font-bold text-slate-600 bg-white border border-blue-200 px-3 py-2 rounded-xl shadow-sm hover:bg-blue-50 hover:text-blue-600 transition-colors active:scale-95 flex items-center gap-1.5">
                                                                            <Icon name={info.icon} size={14} /> {info.label}
                                                                        </button>
                                                                    ))}
                                                                </div>
                                                            )}
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        );
                                    })}

                                    {mode === 'edit' && (
                                        <div className="mt-12 flex justify-center font-sans pb-16">
                                            <button onClick={addSection} className="flex items-center gap-3 bg-slate-800 text-white border-none px-8 py-4 rounded-2xl font-black shadow-2xl hover:bg-slate-900 transition-all active:scale-95 group">
                                                <Icon name="plus" size={20} className="group-hover:rotate-90 transition-transform" /> 大問（セクション）を新規作成
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
